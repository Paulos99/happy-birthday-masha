      <!-- wide bun head ~1.35 -->
      <ellipse class="ol" cx="0" cy="-118" rx="68" ry="50"/>
      <g id="stripes" class="stripe">
        <path d="M-12,-142 Q0,-146 12,-142"/>
        <path d="M-12,-134 Q0,-138 12,-134"/>
        <path d="M-12,-126 Q0,-130 12,-126"/>
      </g>
      <g id="eyes">
