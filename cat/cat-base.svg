<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="220" height="260">
  <defs><style>
    .ol{stroke:#1a1614;stroke-width:3;stroke-linejoin:round;stroke-linecap:round;fill:#fffcf8}
    .stripe{stroke:#918c91;stroke-width:2;fill:none;stroke-linecap:round}
    .blush{fill:#ff9ea8;opacity:.8}
    .inner{fill:#ffbcc0}
    .eye{fill:#1a1614}
    .line{stroke:#1a1614;stroke-width:1.8;stroke-linecap:round;fill:none}
  </style></defs>
  <g id="cat-base" transform="translate(110,230)">
