    <g id="body" data-pivot="0,-58"><ellipse class="ol" cx="0" cy="-58" rx="38" ry="32"/></g>
    <g id="arm-L" data-pivot="-18,-55"><ellipse class="ol" cx="-18" cy="-48" rx="11" ry="10"/></g>
