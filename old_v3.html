<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>С днём рождения, Маша!</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Pacifico&display=swap" rel="stylesheet"/>
<style>
  html,body{margin:0;height:100%;background:#1a1028;overflow:hidden;font-family:Nunito,system-ui,sans-serif}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1a1028}
  #wrap{position:relative;width:100vw;height:100vh;max-height:100vw}
  canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block}
  #fsBtn{position:fixed;right:18px;bottom:18px;z-index:40;border:0;border-radius:999px;padding:12px 18px;
    background:rgba(40,24,50,.72);color:#ffe8d4;font:700 14px Nunito,sans-serif;cursor:pointer;
    opacity:0;transition:opacity .3s;backdrop-filter:blur(6px);box-shadow:0 4px 18px rgba(0,0,0,.35)}
  #fsBtn.visible,body.cursor-visible #fsBtn{opacity:1}
  body.cursor-visible{cursor:default}
  body:not(.cursor-visible){cursor:none}
</style>
</head>
<body>
<div id="stage"><div id="wrap"><canvas id="c"></canvas></div></div>
<button id="fsBtn" type="button">⛶ На весь экран</button>
<script src="config.js"></script>
<script>
(() => {
const C = window.BDAY || {};
const params = new URLSearchParams(location.search);
const FAST = params.has('fast');
const DEBUG = params.has('debug');

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
let W = 1920, H = 1080, dpr = 1;

const SRC_W = 1672, SRC_H = 941; // plate native
const assets = { bg: null, imgs: {}, manifest: null };
const cats = []; // runtime actors
let snow = [];
let t0 = performance.now(), last = t0;
let paint = { idx: 0, phase: 0, progress: 0, holdT: 0, wipeT: 0 };
let candles = []; // synthetic candle states for burn cycle
let actIdx = 0, actT = 0;
let bubble = null; // {x,y,text,ttl}

const greetings = C.paintedGreetings || ['С днём рождения, Маша'];
const compliments = C.compliments || [];
const lines = C.lines || {};

function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  const vw = window.innerWidth, vh = window.innerHeight;
  // letterbox 16:9
  let cw = vw, ch = vw * 9 / 16;
  if (ch > vh) { ch = vh; cw = vh * 16 / 9; }
  W = 1920; H = 1080;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);

function sx(x) { return x * W / SRC_W; }
function sy(y) { return y * H / SRC_H; }

async function loadAssets() {
  const man = await fetch('sprites/manifest.json').then(r => r.json());
  assets.manifest = man;
  assets.bg = await loadImg('sprites/bg_1920.jpg');
  await Promise.all(Object.entries(man.cats).map(async ([name, meta]) => {
    assets.imgs[name] = await loadImg(meta.file);
  }));
}

function loadImg(src) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = rej;
    im.src = src + '?v=' + Date.now();
  });
}

function initCats() {
  const man = assets.manifest;
  cats.length = 0;
  const order = ['easel','painter','waiterCloche','waiterPlate','compliment','dancer','lamplighter','photo','snow'];
  for (const name of order) {
    const m = man.cats[name];
    if (!m) continue;
    const homeX = sx(m.x + m.w / 2);
    const homeY = sy(m.y + m.h); // feet
    cats.push({
      name, role: m.role || name,
      img: assets.imgs[name],
      meta: m,
      x: homeX, y: homeY,
      homeX, homeY,
      w: sx(m.w), h: sy(m.h),
      bobPhase: Math.random() * Math.PI * 2,
      swayPhase: Math.random() * Math.PI * 2,
      targetX: null, targetY: null,
      state: 'idle', walkSpeed: 55,
      bubble: null, bubbleT: 0,
      facing: 1, pose: 0,
      fixed: name === 'easel', // easel stays put
    });
  }
}

function initCandles() {
  // Approximate candle positions on table (in 1920 space) for glow + burn cycle
  const pts = [
    [0.48, 0.42], [0.50, 0.41], [0.52, 0.42], [0.54, 0.41], [0.56, 0.42], // cake
    [0.58, 0.46], [0.60, 0.45], [0.62, 0.46], // candelabra
    [0.44, 0.48], [0.46, 0.50],
  ];
  candles = pts.map(([nx, ny], i) => ({
    x: W * nx, y: H * ny,
    lit: true,
    life: 90 + i * 12 + Math.random() * 30, // ~1.5–2.5 min
    max: 120,
  }));
}

function initSnow() {
  snow = Array.from({ length: 70 }, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    r: 1 + Math.random() * 2.2,
    v: 12 + Math.random() * 28,
    drift: (Math.random() - 0.5) * 16,
    a: 0.25 + Math.random() * 0.45,
  }));
}

function getCat(role) { return cats.find(c => c.role === role || c.name === role); }

function walkTo(c, x, y, speed) {
  if (c.fixed) return;
  c.state = 'walk';
  c.targetX = x; c.targetY = y;
  c.walkSpeed = speed || 55;
}

function clampCat(c) {
  // keep in floor band, avoid table center & polaroid & title
  const minY = H * 0.55, maxY = H * 0.96;
  c.y = Math.min(maxY, Math.max(minY, c.y));
  c.x = Math.min(W * 0.96, Math.max(W * 0.04, c.x));
  // never onto table top ellipse
  const tcx = W * 0.50, tcy = H * 0.52, tw = W * 0.22, th = H * 0.12;
  const dx = (c.x - tcx) / tw, dy = (c.y - tcy) / th;
  if (dx * dx + dy * dy < 1 && c.y < tcy + th * 0.9) {
    c.y = tcy + th * 0.95;
  }
}

function separateCats() {
  for (let pass = 0; pass < 3; pass++) {
    for (let i = 0; i < cats.length; i++) {
      for (let j = i + 1; j < cats.length; j++) {
        const a = cats[i], b = cats[j];
        if (a.fixed || b.fixed) continue;
        if (a.name === 'easel' || b.name === 'easel') continue;
        const minDist = (a.w + b.w) * 0.28;
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 0.01;
        if (d < minDist) {
          const push = (minDist - d) * 0.5;
          const nx = dx / d, ny = dy / d;
          a.x -= nx * push; b.x += nx * push;
          a.y -= ny * push * 0.2; b.y += ny * push * 0.2;
          clampCat(a); clampCat(b);
        }
      }
    }
  }
}

function updateCat(c, dt) {
  c.bobPhase += dt * (c.role === 'dancer' ? 5 : 2.2);
  c.swayPhase += dt * 1.4;
  if (c.bubbleT > 0) { c.bubbleT -= dt; if (c.bubbleT <= 0) c.bubble = null; }
  if (c.fixed) return;
  if (c.state === 'walk' && c.targetX != null) {
    const dx = c.targetX - c.x, dy = (c.targetY != null ? c.targetY : c.y) - c.y;
    const dist = Math.hypot(dx, dy) || 1;
    c.facing = dx >= 0 ? 1 : -1;
    const step = c.walkSpeed * dt;
    if (dist <= step) {
      c.x = c.targetX; c.y = c.targetY != null ? c.targetY : c.y;
      c.state = 'idle'; c.targetX = null; c.targetY = null;
      if (c.onArrive) { const fn = c.onArrive; c.onArrive = null; fn(); }
    } else {
      c.x += dx / dist * step;
      c.y += dy / dist * step;
    }
  }
  clampCat(c);
}

/* ---------- paint cycle on easel ---------- */
function startPaintCycle() {
  paint.idx = paint.idx % greetings.length;
  paint.phase = 0; paint.progress = 0; paint.holdT = 0; paint.wipeT = 0;
  const p = getCat('painter');
  if (p) {
    walkTo(p, p.homeX, p.homeY, 60);
    p.bubble = lines.paint || 'Сейчас нарисую';
    p.bubbleT = 2.5;
  }
}

function updatePainter(dt) {
  const p = getCat('painter');
  if (paint.phase === 0) {
    paint.progress = Math.min(1, paint.progress + dt * (FAST ? 0.35 : 0.10));
    if (p && p.state !== 'walk') { p.x = p.homeX; p.y = p.homeY; }
    if (paint.progress >= 1) {
      paint.phase = 1; paint.holdT = 0;
      if (p) {
        p.bubble = compliments[paint.idx % compliments.length] || '♥';
        p.bubbleT = 4;
      }
    }
  } else if (paint.phase === 1) {
    paint.holdT += dt;
    if (paint.holdT > (FAST ? 10 : 140)) {
      paint.phase = 2; paint.wipeT = 0;
    }
  } else {
    paint.wipeT = Math.min(1, paint.wipeT + dt * (FAST ? 0.55 : 0.22));
    if (paint.wipeT >= 1) {
      paint.idx = (paint.idx + 1) % greetings.length;
      startPaintCycle();
    }
  }
}

/* ---------- lamplighter / candles ---------- */
function updateCandles(dt) {
  candles.forEach(cd => {
    if (cd.lit) {
      cd.life -= dt;
      if (cd.life <= 0) { cd.lit = false; cd.life = 0; }
    }
  });
  const L = getCat('lamplighter');
  if (!L || L.state === 'walk') return;
  const unlit = candles.filter(c => !c.lit);
  if (!unlit.length) {
    if (Math.random() < 0.008) walkTo(L, L.homeX + (Math.random() - 0.5) * 20, L.homeY, 40);
    return;
  }
  const target = unlit[0];
  // approach near candle but stay on floor / ladder home-ish
  walkTo(L, Math.min(W * 0.72, Math.max(W * 0.55, target.x + 30)), L.homeY, 50);
  L.onArrive = () => {
    target.lit = true;
    target.life = target.max * (0.7 + Math.random() * 0.5);
    L.bubble = lines.light || 'Сейчас зажгу';
    L.bubbleT = 2.2;
    walkTo(L, L.homeX, L.homeY, 45);
  };
}

/* ---------- acts ---------- */
const ACTS = [
  { id: 'welcome', dur: 35, fn() {
    const w = getCat('waiterCloche'); if (w) { w.bubble = lines.welcome || 'Добро пожаловать'; w.bubbleT = 4; }
  }},
  { id: 'serve', dur: 40, fn() {
    const w = getCat('waiterPlate'); if (!w) return;
    w.bubble = lines.serve || 'Горячее с пылу'; w.bubbleT = 3.5;
    walkTo(w, w.homeX + 40, w.homeY - 10, 50);
  }},
  { id: 'pour', dur: 40, fn() {
    const w = getCat('waiterCloche'); if (!w) return;
    w.bubble = lines.pour || 'Хванчкара для вас'; w.bubbleT = 3.5;
    walkTo(w, w.homeX + 55, w.homeY - 8, 48);
  }},
  { id: 'compliment', dur: 35, fn() {
    const c = getCat('compliment'); if (!c) return;
    c.bubble = '❤'; c.bubbleT = 4;
  }},
  { id: 'dance', dur: 40, fn() {
    const d = getCat('dancer'); if (!d) return;
    d.bubble = lines.dance || '♪'; d.bubbleT = 4;
    walkTo(d, d.homeX + 30, d.homeY, 40);
  }},
  { id: 'photo', dur: 40, fn() {
    const p = getCat('photo'); if (!p) return;
    p.bubble = lines.photo || 'Улыбочку'; p.bubbleT = 3.5;
    p.flash = 1;
  }},
  { id: 'snow', dur: 35, fn() {
    const s = getCat('snow'); if (!s) return;
    s.bubble = lines.snow || 'Снежок!'; s.bubbleT = 3;
    s.throwT = 2.5;
  }},
  { id: 'toast', dur: 35, fn() {
    cats.forEach(c => { if (!c.fixed) c.bubble = lines.toast || 'За Машу!'; c.bubbleT = 3; });
  }},
  { id: 'home', dur: 45, fn() {
    cats.forEach(c => { if (!c.fixed) walkTo(c, c.homeX, c.homeY, 45); });
  }},
];

function updateActs(dt) {
  actT += dt;
  const cur = ACTS[actIdx % ACTS.length];
  if (actT > (FAST ? cur.dur * 0.25 : cur.dur)) {
    actT = 0;
    actIdx = (actIdx + 1) % ACTS.length;
    ACTS[actIdx].fn();
  }
}

/* ---------- drawing ---------- */
function drawBg() {
  ctx.drawImage(assets.bg, 0, 0, W, H);
}

function drawPaintOverlay() {
  // easel canvas region — write/wipe greetings
  const e = getCat('easel') || assets.manifest.cats.easel;
  if (!e) return;
  const meta = e.meta || e;
  const x = sx(meta.x), y = sy(meta.y), w = sx(meta.w), h = sy(meta.h);
  // canvas area roughly upper 55% of easel sprite
  const cx = x + w * 0.18, cy = y + h * 0.08, cw = w * 0.64, ch = h * 0.42;
  ctx.save();
  if (paint.phase === 2) {
    // wipe — cover with soft cream
    ctx.globalAlpha = paint.wipeT;
    ctx.fillStyle = '#f7f0e6';
    ctx.fillRect(cx, cy, cw, ch);
  } else {
    const text = greetings[paint.idx % greetings.length];
    const reveal = paint.phase === 0 ? paint.progress : 1;
    ctx.beginPath();
    ctx.rect(cx, cy, cw * reveal, ch);
    ctx.clip();
    ctx.fillStyle = 'rgba(247,240,230,.92)';
    ctx.fillRect(cx, cy, cw, ch);
    ctx.fillStyle = '#c45a6a';
    ctx.font = '700 15px Nunito,sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // wrap short
    const words = text.split(' ');
    let line = '', linesArr = [], maxW = cw - 10;
    words.forEach(wd => {
      const test = line ? line + ' ' + wd : wd;
      if (ctx.measureText(test).width > maxW) { linesArr.push(line); line = wd; }
      else line = test;
    });
    if (line) linesArr.push(line);
    linesArr.forEach((ln, i) => {
      ctx.fillText(ln, cx + cw / 2, cy + ch / 2 + (i - (linesArr.length - 1) / 2) * 16);
    });
  }
  ctx.restore();
}

function drawCatSprite(c, time) {
  if (!c.img) return;
  const bob = c.fixed ? 0 : Math.sin(c.bobPhase) * (c.role === 'dancer' ? 7 : 3.5);
  const sway = c.fixed ? 0 : Math.sin(c.swayPhase) * (c.role === 'dancer' ? 4 : 1.5);
  const walkBob = c.state === 'walk' ? Math.sin(time * 10) * 3 : 0;
  ctx.save();
  ctx.translate(c.x + sway, c.y + bob + walkBob);
  // sprite drawn with feet at origin
  const dw = c.w, dh = c.h;
  if (c.facing < 0 && !c.fixed) {
    ctx.scale(-1, 1);
  }
  ctx.drawImage(c.img, -dw / 2, -dh, dw, dh);
  ctx.restore();

  // camera flash
  if (c.flash > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, c.flash);
    ctx.fillStyle = 'rgba(255,250,220,.55)';
    ctx.beginPath();
    ctx.arc(c.x + c.w * 0.15, c.y - c.h * 0.55, 40 * c.flash, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    c.flash -= 0.04;
  }
  // snow throw puffs
  if (c.throwT > 0) {
    c.throwT -= 0.016;
    for (let i = 0; i < 6; i++) {
      const ang = -Math.PI / 2 + (i - 2.5) * 0.25;
      const r = 20 + (2.5 - c.throwT) * 40;
      ctx.globalAlpha = Math.max(0, c.throwT / 2.5) * 0.7;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(c.x + Math.cos(ang) * r, c.y - c.h * 0.6 + Math.sin(ang) * r * 0.6, 4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  // music notes for dancer
  if (c.role === 'dancer') {
    const n = Math.sin(time * 3 + c.bobPhase);
    ctx.font = '18px Nunito';
    ctx.globalAlpha = 0.7;
    ctx.fillText('♪', c.x + 28, c.y - c.h * 0.85 + n * 6);
    ctx.fillText('♫', c.x - 34, c.y - c.h * 0.7 - n * 5);
    ctx.globalAlpha = 1;
  }
}

function drawBubble(c) {
  if (!c.bubble) return;
  const bx = c.x, by = c.y - c.h - 12;
  const text = c.bubble;
  ctx.font = '700 15px Nunito,sans-serif';
  const tw = Math.max(28, ctx.measureText(text).width + 18);
  const th = 28;
  ctx.save();
  ctx.fillStyle = 'rgba(255,245,250,.95)';
  ctx.strokeStyle = '#2a2220';
  ctx.lineWidth = 2;
  roundRect(bx - tw / 2, by - th, tw, th, 10);
  ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(bx - 6, by); ctx.lineTo(bx, by + 8); ctx.lineTo(bx + 6, by);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#c45a6a';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, bx, by - th / 2);
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawCandleGlows(time) {
  candles.forEach((cd, i) => {
    if (!cd.lit) return;
    const flick = 0.75 + Math.sin(time * 8 + i) * 0.15 + Math.sin(time * 13 + i * 2) * 0.1;
    const g = ctx.createRadialGradient(cd.x, cd.y, 0, cd.x, cd.y, 28 * flick);
    g.addColorStop(0, 'rgba(255,200,80,' + (0.55 * flick) + ')');
    g.addColorStop(0.4, 'rgba(255,140,40,' + (0.22 * flick) + ')');
    g.addColorStop(1, 'rgba(255,100,20,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cd.x, cd.y, 28 * flick, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawSnow(dt) {
  snow.forEach(s => {
    s.y += s.v * dt;
    s.x += s.drift * dt;
    if (s.y > H + 4) { s.y = -4; s.x = Math.random() * W; }
    if (s.x < -4) s.x = W + 4;
    if (s.x > W + 4) s.x = -4;
    ctx.globalAlpha = s.a;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const time = (now - t0) / 1000;

  drawBg();
  drawCandleGlows(time);

  updatePainter(dt);
  updateCandles(dt);
  updateActs(dt);
  cats.forEach(c => updateCat(c, dt));
  separateCats();

  // draw back-to-front by feet y
  cats.slice().sort((a, b) => a.y - b.y).forEach(c => {
    drawCatSprite(c, time);
  });
  drawPaintOverlay(); // on top of easel canvas
  cats.forEach(drawBubble);

  drawSnow(dt);

  if (DEBUG) {
    window.__BDAY_DEBUG = {
      W, H,
      cats: cats.map(c => ({
        role: c.role, name: c.name, x: c.x, y: c.y,
        box: { x: c.x - c.w / 2, y: c.y - c.h, w: c.w, h: c.h }
      })),
      paint, act: ACTS[actIdx % ACTS.length].id,
      candlesLit: candles.filter(c => c.lit).length,
    };
  }

  requestAnimationFrame(frame);
}

/* ---------- fullscreen ---------- */
const fsBtn = document.getElementById('fsBtn');
let fsTimer;
function showFs() {
  document.body.classList.add('cursor-visible');
  fsBtn.classList.add('visible');
  clearTimeout(fsTimer);
  fsTimer = setTimeout(() => {
    fsBtn.classList.remove('visible');
    document.body.classList.remove('cursor-visible');
  }, 2500);
}
function toggleFs() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
}
fsBtn.textContent = '⛶ ' + (C.ui && C.ui.fullscreen || 'На весь экран');
fsBtn.addEventListener('click', toggleFs);
window.addEventListener('mousemove', showFs);
window.addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F' || e.key === 'а' || e.key === 'А') toggleFs();
});

(async function boot() {
  resize();
  await loadAssets();
  initCats();
  initCandles();
  initSnow();
  startPaintCycle();
  ACTS[0].fn();
  requestAnimationFrame(now => { t0 = last = now; frame(now); });
})();
})();
</script>
</body>
</html>
