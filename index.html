<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>С днём рождения, Маша</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Manrope:wght@300;400;500&display=swap');
  :root {
    --bg0:#0b0610; --bg1:#1a0d18; --warm:#ffb38a; --gold:#f6d7a8; --rose:#ff8fab; --soft:#ffe8d6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#2a1524 0%,var(--bg1) 42%,var(--bg0) 100%);color:var(--soft);font-family:Manrope,system-ui,sans-serif;cursor:none;user-select:none;-webkit-user-select:none}
  body.cursor-visible,body.cursor-visible *{cursor:default}
  body.cursor-visible #fsBtn{cursor:pointer}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1}
  .glow{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse 60% 40% at 50% 78%,rgba(255,140,80,.18),transparent 70%),radial-gradient(ellipse 40% 30% at 18% 82%,rgba(255,100,60,.1),transparent 60%),radial-gradient(ellipse 40% 30% at 82% 82%,rgba(255,100,60,.1),transparent 60%),radial-gradient(ellipse 50% 35% at 50% 12%,rgba(255,180,140,.08),transparent 65%);animation:candle 6s ease-in-out infinite}
  @keyframes candle{0%,100%{opacity:.85}50%{opacity:1}}
  .vignette{position:fixed;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(5,2,8,.55) 100%)}
  .content{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4vh 6vw;pointer-events:none}
  .age{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:clamp(7rem,22vw,18rem);line-height:.85;letter-spacing:.04em;color:rgba(246,215,168,.13);text-shadow:0 0 40px rgba(255,179,138,.32),0 0 90px rgba(255,140,100,.22);margin-bottom:-.18em;animation:ageBreath 7s ease-in-out infinite;position:relative}
  @keyframes ageBreath{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.015);filter:brightness(1.08)}}
  .greeting{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-style:italic;font-size:clamp(2.4rem,6.5vw,5.2rem);line-height:1.15;letter-spacing:.02em;color:var(--gold);text-shadow:0 0 18px rgba(255,200,140,.55),0 0 48px rgba(255,150,100,.35),0 2px 8px rgba(0,0,0,.45);transition:opacity .8s ease,transform .8s ease}
  .greeting.swap{opacity:0;transform:translateY(-8px)}
  .name{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:clamp(1.8rem,4.2vw,3.2rem);letter-spacing:.18em;text-transform:uppercase;color:var(--warm);margin-top:.35em;text-shadow:0 0 16px rgba(255,160,120,.5),0 0 40px rgba(255,120,90,.28)}
  .name.hidden{display:none}
  .line{margin-top:1.4em;max-width:28em;font-weight:300;font-size:clamp(1rem,2.1vw,1.45rem);line-height:1.55;letter-spacing:.03em;color:rgba(255,232,214,.82);text-shadow:0 0 12px rgba(255,180,140,.25);min-height:2.8em;transition:opacity .8s ease,transform .8s ease}
  .line.swap{opacity:0;transform:translateY(8px)}
  .date{margin-top:1.6em;font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(.95rem,1.6vw,1.25rem);letter-spacing:.28em;color:rgba(246,215,168,.55)}
  #fsBtn{position:fixed;right:max(16px,2vw);bottom:max(16px,2.2vh);z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px 10px 12px;border:1px solid rgba(246,215,168,.28);border-radius:999px;background:rgba(30,14,24,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:rgba(255,232,214,.9);font:500 .85rem/1 Manrope,system-ui,sans-serif;letter-spacing:.04em;box-shadow:0 8px 28px rgba(0,0,0,.35),inset 0 0 20px rgba(255,160,100,.08);opacity:0;transform:translateY(8px);transition:opacity .35s ease,transform .35s ease,background .2s ease;pointer-events:none}
  #fsBtn svg{width:22px;height:22px;flex:0 0 auto}
  #fsBtn.visible{opacity:1;transform:translateY(0);pointer-events:auto}
  #fsBtn:hover{background:rgba(50,22,36,.72);border-color:rgba(246,215,168,.5)}
  body.is-fs #fsBtn{opacity:0!important;pointer-events:none!important}
  .hint{position:fixed;bottom:2.2vh;left:50%;transform:translateX(-50%);z-index:5;font-size:.72rem;letter-spacing:.12em;color:rgba(255,232,214,.28);transition:opacity 1.2s ease;pointer-events:none}
  .hint.fade{opacity:0}
  @media (orientation:portrait){.age{font-size:clamp(6rem,36vw,14rem)}.greeting{font-size:clamp(2rem,8vw,3.6rem)}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="glow" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>
<main class="content">
  <div class="age" id="age">24</div>
  <h1 class="greeting" id="greeting">С днём рождения!</h1>
  <div class="name" id="nameEl"></div>
  <p class="line" id="warmLine">Пусть этот вечер будет тёплым — как вино, как свечи, как снег за окном.</p>
  <p class="date">05.11.2002 — 05.11.2026</p>
</main>
<button id="fsBtn" type="button" aria-label="На весь экран" title="На весь экран (F)">
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <ellipse cx="32" cy="38" rx="18" ry="14" fill="#f3c9a0"/>
    <circle cx="18" cy="22" r="9" fill="#f3c9a0"/>
    <circle cx="46" cy="22" r="9" fill="#f3c9a0"/>
    <circle cx="32" cy="30" r="14" fill="#f6d3ae"/>
    <path d="M12 16l6 10H10z" fill="#e8a57a"/><path d="M52 16l-6 10h8z" fill="#e8a57a"/>
    <circle cx="26" cy="28" r="2.2" fill="#3a2430"/><circle cx="38" cy="28" r="2.2" fill="#3a2430"/>
    <circle cx="26.7" cy="27.3" r=".7" fill="#fff"/><circle cx="38.7" cy="27.3" r=".7" fill="#fff"/>
    <ellipse cx="32" cy="33" rx="2.2" ry="1.4" fill="#e0899a"/>
    <path d="M32 34.2c0 2.4-2 3.6-4 3" stroke="#c97a88" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M32 34.2c0 2.4 2 3.6 4 3" stroke="#c97a88" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M14 32h-6M14 35h-7M50 32h6M50 35h7" stroke="#d9b08a" stroke-width="1.4" stroke-linecap="round"/>
  </svg>
  <span>На весь экран</span>
</button>
<div class="hint" id="hint">F или лапка справа — на весь экран</div>
<script src="photos.js"></script>
<script>
/* ============================================================
   CONFIG — NAME default, override with ?name=
   ============================================================ */
const NAME = 'Маша';
const AGE = 24;
const WISHES = [
  'Пусть этот вечер будет тёплым — как вино, как свечи, как снег за окном.',
  'Маша, пусть рядом будет только то, что греет.',
  'Ещё один год — и ты всё такая же светлая.',
  'Пусть желания сбудутся тихо, без спешки.',
  'Сегодня можно просто быть счастливой.',
  'Снег за окном, вино в бокале — и ты.',
  'Пусть этот день запомнится мягко и надолго.',
  'Любви, уюта и котиков. Особенно котиков.'
];
const GREETINGS = [
  'С днём рождения!',
  'С твоим днём, Маша!',
  'С праздником!',
  'Только для тебя'
];
/* ============================================================ */

(function(){
  const params = new URLSearchParams(location.search);
  const name = (params.get('name') || NAME || '').trim();
  const nameEl = document.getElementById('nameEl');
  if (name) { nameEl.textContent = name; document.title = 'С днём рождения, ' + name; }
  else nameEl.classList.add('hidden');
  document.getElementById('age').textContent = String(AGE);
  document.getElementById('warmLine').textContent = WISHES[0];

  // ---- photographer photos ----
  const PHOTO_LIST = (window.PHOTOS || []).filter(Boolean);
  const photoImgs = PHOTO_LIST.map(src => {
    const im = new Image();
    im.src = src;
    return im;
  });
  let photoIdx = 0;
  function nextPhoto() {
    if (!photoImgs.length) return null;
    const im = photoImgs[photoIdx % photoImgs.length];
    photoIdx++;
    return im;
  }


  // ---- fullscreen ----
  const fsBtn = document.getElementById('fsBtn');
  function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function enterFs(){
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen;
    if (req) return Promise.resolve(req.call(el)).catch(()=>{});
  }
  function exitFs(){
    const ex = document.exitFullscreen || document.webkitExitFullscreen;
    if (ex) return Promise.resolve(ex.call(document)).catch(()=>{});
  }
  function toggleFs(){ if (isFs()) exitFs(); else enterFs(); }
  function syncFsClass(){ document.body.classList.toggle('is-fs', isFs()); updateFsVisibility(); }
  ['fullscreenchange','webkitfullscreenchange'].forEach(e => document.addEventListener(e, syncFsClass));
  fsBtn.addEventListener('click', (e)=>{ e.stopPropagation(); toggleFs(); });
  window.addEventListener('keydown', (e)=>{
    if (e.key === 'f' || e.key === 'F' || e.key === 'а' || e.key === 'А') { e.preventDefault(); toggleFs(); }
    if (e.key === 'Escape') syncFsClass();
  });
  let lastClick = 0;
  window.addEventListener('click', (e)=>{
    if (e.target.closest && e.target.closest('#fsBtn')) return;
    const now = Date.now();
    if (now - lastClick < 400) toggleFs();
    lastClick = now;
  });

  // ---- cursor / button idle ----
  let idleTimer;
  function showUi(){
    document.body.classList.add('cursor-visible');
    updateFsVisibility(true);
    clearTimeout(idleTimer);
    idleTimer = setTimeout(()=>{
      document.body.classList.remove('cursor-visible');
      updateFsVisibility(false);
    }, 2000);
  }
  function updateFsVisibility(forceShow){
    if (isFs()) { fsBtn.classList.remove('visible'); return; }
    if (forceShow === false) fsBtn.classList.remove('visible');
    else if (forceShow === true || document.body.classList.contains('cursor-visible')) fsBtn.classList.add('visible');
  }
  ['mousemove','mousedown','touchstart','keydown'].forEach(ev => window.addEventListener(ev, showUi, {passive:true}));
  showUi();
  setTimeout(()=>document.getElementById('hint').classList.add('fade'), 6000);

  // ---- canvas world ----
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha:true });
  let W=0,H=0,dpr=1, snow=[], heartsFX=[], sparks=[], candles=[], fairy=[], glasses, cake, snowman;
  let wishIdx=0, greetIdx=0, lastT=0;

  // palette helpers for cats
  const PALETTES = [
    {fur:'#f0c9a0', ear:'#e8a07a', belly:'#ffe6c8', stripe:null, accent:'#c97b5a'},
    {fur:'#d4b08c', ear:'#c48a6a', belly:'#f5e0c4', stripe:'#b88968', accent:'#8d5a3e'},
    {fur:'#f5f0ea', ear:'#f0b8b0', belly:'#ffffff', stripe:null, accent:'#d9cfc4'},
    {fur:'#c9a07a', ear:'#b07858', belly:'#ead2b4', stripe:'#9a6d4c', accent:'#7a4e32'},
    {fur:'#e8b4c8', ear:'#d989a8', belly:'#ffe0ec', stripe:null, accent:'#c76b8e'},
    {fur:'#a8c4e8', ear:'#8aaad4', belly:'#e4eefc', stripe:null, accent:'#6a8cbc'}
  ];

  function resize(){
    dpr = Math.min(devicePixelRatio||1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = Math.floor(W*dpr); canvas.height = Math.floor(H*dpr);
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    seedWorld();
  }

  function seedWorld(){
    const n = Math.min(110, Math.max(50, Math.floor(W*H/16000)));
    snow = Array.from({length:n}, ()=>({
      x:Math.random()*W, y:Math.random()*H, r:.5+Math.random()*2.2,
      vy:.2+Math.random()*.7, vx:(Math.random()-.5)*.3, ph:Math.random()*6.28, a:.25+Math.random()*.5
    }));
    // cake at bottom center
    cake = { x:W*0.5, y:H*0.86, lit:0, targetLit:0 };
    candles = [ -38,-18,0,18,38 ].map((dx,i)=>({ dx, lit:false, flame:Math.random()*6 }));
    fairy = Array.from({length:14}, (_,i)=>({ i, lit:false, tw:Math.random()*6 }));
    glasses = { x:W*0.18, y:H*0.78, fill:0, target:0 };
    snowman = { x:W*0.84, y:H*0.82, parts:0, target:0 };
    placeCats();
  }

  // ---- cute cat drawing ----
  function drawCat(c, t){
    const blink = (Math.sin(t*c.blinkSpeed + c.blinkPhase)+1) < 0.06 || c.forceBlink > 0;
    const walk = c.state==='walk' || c.state==='carry';
    const bob = walk ? Math.sin(t*c.walkSpeed)*2.2 : Math.sin(t*1.2+c.phase)*1.1;
    const leg = walk ? Math.sin(t*c.walkSpeed)*0.45 : 0;
    const facing = c.facing || 1;
    const s = c.scale;
    const p = c.pal;
    ctx.save();
    ctx.translate(c.x, c.y + bob);
    ctx.scale(facing*s, s);

    // shadow
    ctx.beginPath();
    ctx.ellipse(0, 22, 16, 4, 0, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.fill();

    // tail
    ctx.save();
    ctx.translate(-14, 4);
    const tw = Math.sin(t*2.2 + c.phase)*0.45 + (c.tailExtra||0);
    ctx.rotate(-0.6 + tw);
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.quadraticCurveTo(-10, -16, -4, -30);
    ctx.strokeStyle = p.fur; ctx.lineWidth=6; ctx.lineCap='round'; ctx.stroke();
    ctx.beginPath();
    ctx.arc(-4,-30,3.2,0,Math.PI*2); ctx.fillStyle=p.ear; ctx.fill();
    ctx.restore();

    // back leg
    ctx.save();
    ctx.translate(-6, 14); ctx.rotate(leg);
    roundRect(-3,0,6,12,3,p.fur); ctx.restore();
    // front leg
    ctx.save();
    ctx.translate(8, 14); ctx.rotate(-leg);
    roundRect(-3,0,6,12,3,p.fur); ctx.restore();

    // body
    ctx.beginPath();
    ctx.ellipse(0, 4, 16, 13, 0, 0, Math.PI*2);
    ctx.fillStyle = p.fur; ctx.fill();
    // belly
    ctx.beginPath();
    ctx.ellipse(2, 7, 9, 8, 0, 0, Math.PI*2);
    ctx.fillStyle = p.belly; ctx.fill();
    if (p.stripe){
      ctx.strokeStyle = p.stripe; ctx.lineWidth=2; ctx.globalAlpha=.55;
      for (let i=-1;i<=1;i++){
        ctx.beginPath(); ctx.moveTo(-8, i*5); ctx.quadraticCurveTo(0, i*5-3, 8, i*5); ctx.stroke();
      }
      ctx.globalAlpha=1;
    }

    // head
    ctx.beginPath();
    ctx.arc(10, -12, 13, 0, Math.PI*2);
    ctx.fillStyle = p.fur; ctx.fill();

    // ears
    ear(2,-22, p.fur, p.ear, -0.15);
    ear(18,-22, p.fur, p.ear, 0.15);

    // eyes
    if (blink || c.asleep){
      ctx.strokeStyle = '#3a2430'; ctx.lineWidth=1.6; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(5,-13); ctx.lineTo(9,-13); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(13,-13); ctx.lineTo(17,-13); ctx.stroke();
      if (c.asleep){
        // zzz
        ctx.fillStyle='rgba(255,230,200,0.7)';
        ctx.font='bold 10px Manrope,sans-serif';
        ctx.fillText('z', 24, -28 - Math.sin(t*2)*2);
        ctx.fillText('z', 28, -36 - Math.sin(t*2+1)*2);
      }
    } else {
      eye(7,-13, c.eyeMood);
      eye(15,-13, c.eyeMood);
    }

    // nose + mouth
    ctx.beginPath();
    ctx.ellipse(11,-9,2,1.4,0,0,Math.PI*2);
    ctx.fillStyle='#e0899a'; ctx.fill();
    ctx.strokeStyle='#c97a88'; ctx.lineWidth=1; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(11,-7.6); ctx.quadraticCurveTo(9,-5.5,7.5,-6.2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(11,-7.6); ctx.quadraticCurveTo(13,-5.5,14.5,-6.2); ctx.stroke();

    // whiskers
    ctx.strokeStyle='rgba(217,176,138,0.7)'; ctx.lineWidth=1;
    [[-2,-9,-12,-11],[-2,-7,-12,-7],[-2,-5,-12,-3],[24,-9,34,-11],[24,-7,34,-7],[24,-5,34,-3]].forEach(([a,b,c2,d])=>{
      ctx.beginPath(); ctx.moveTo(a,b); ctx.lineTo(c2,d); ctx.stroke();
    });

    // cheeks
    ctx.beginPath(); ctx.arc(4,-8,2.4,0,Math.PI*2); ctx.fillStyle='rgba(255,150,160,0.28)'; ctx.fill();
    ctx.beginPath(); ctx.arc(18,-8,2.4,0,Math.PI*2); ctx.fill();

    // held props
    if (c.prop === 'sign') drawSign(c, t);
    if (c.prop === 'match') drawMatch(c, t);
    if (c.prop === 'balloon') drawBalloon(c, t);
    if (c.prop === 'wand') drawWand(c, t);
    if (c.prop === 'bottle') drawBottle(c, t);
    if (c.prop === 'net') drawNet(c, t);
    if (c.prop === 'camera') drawCamera(c, t);
    if (c.prop === 'polaroid') drawPolaroid(c, t);

    ctx.restore();
    if (c.forceBlink > 0) c.forceBlink -= 0.016;
  }

  function ear(x,y,fur,inner,tilt){
    ctx.save(); ctx.translate(x,y); ctx.rotate(tilt);
    ctx.beginPath(); ctx.moveTo(-5,4); ctx.lineTo(0,-10); ctx.lineTo(5,4); ctx.closePath();
    ctx.fillStyle=fur; ctx.fill();
    ctx.beginPath(); ctx.moveTo(-2.5,3); ctx.lineTo(0,-5); ctx.lineTo(2.5,3); ctx.closePath();
    ctx.fillStyle=inner; ctx.fill();
    ctx.restore();
  }
  function eye(x,y,mood){
    ctx.beginPath(); ctx.ellipse(x,y,2.6, mood==='happy'?2.1:2.6,0,0,Math.PI*2);
    ctx.fillStyle='#3a2430'; ctx.fill();
    ctx.beginPath(); ctx.arc(x+0.8,y-0.9,0.8,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
  }
  function roundRect(x,y,w,h,r,fill){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
    ctx.fillStyle=fill; ctx.fill();
  }
  function drawSign(c,t){
    ctx.save(); ctx.translate(22, -8); ctx.rotate(-0.15+Math.sin(t*2)*.05);
    roundRect(-2,-18,36,22,4,'#fff6e8');
    ctx.strokeStyle='rgba(200,150,110,0.5)'; ctx.lineWidth=1.2; ctx.stroke();
    ctx.fillStyle='#8a5a40'; ctx.font='600 7px Manrope,sans-serif';
    ctx.textAlign='center';
    const txt = (c.signText||'♥').slice(0,12);
    ctx.fillText(txt, 16, -5);
    ctx.beginPath(); ctx.moveTo(0,4); ctx.lineTo(0,16); ctx.strokeStyle='#c9a07a'; ctx.lineWidth=2; ctx.stroke();
    ctx.restore();
  }
  function drawMatch(c,t){
    ctx.save(); ctx.translate(20,-2); ctx.rotate(-0.8);
    ctx.fillStyle='#d4a574'; roundRect(-1,-14,2,16,1,'#d4a574');
    if (c.lit){
      const f = 0.7+Math.sin(t*12)*0.3;
      const g=ctx.createRadialGradient(0,-16,0,0,-16,8);
      g.addColorStop(0,`rgba(255,220,120,${f})`); g.addColorStop(1,'rgba(255,100,40,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,-16,8,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(0,-16,2,3.5,0,0,Math.PI*2); ctx.fillStyle=`rgba(255,180,60,${f})`; ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(0,-14,2,0,Math.PI*2); ctx.fillStyle='#c45a4a'; ctx.fill();
    }
    ctx.restore();
  }
  function drawBalloon(c,t){
    ctx.save(); ctx.translate(18,-28); ctx.translate(0, Math.sin(t*1.5+c.phase)*3);
    ctx.beginPath(); ctx.moveTo(0,18); ctx.quadraticCurveTo(2,28,0,36); ctx.strokeStyle='rgba(255,220,200,0.5)'; ctx.lineWidth=1; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0,0,10,12,0,0,Math.PI*2);
    ctx.fillStyle = c.balloonColor || '#ff8fab'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(-2,11); ctx.lineTo(0,15); ctx.lineTo(2,11); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-3,-4,2.5,3.5, -0.4,0,Math.PI*2); ctx.fillStyle='rgba(255,255,255,0.45)'; ctx.fill();
    ctx.restore();
  }
  function drawWand(c,t){
    ctx.save(); ctx.translate(20,-4); ctx.rotate(-0.9+Math.sin(t*3)*.1);
    ctx.strokeStyle='#f6d7a8'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-22); ctx.stroke();
    const spark = 0.6+Math.sin(t*8)*.4;
    ctx.fillStyle=`rgba(255,220,140,${spark})`;
    star(0,-24,5,2.5);
    ctx.restore();
  }
  function drawBottle(c,t){
    ctx.save(); ctx.translate(18,-2); ctx.rotate(-0.2);
    roundRect(-4,-16,8,18,2,'#5a1a28');
    roundRect(-2,-20,4,5,1,'#3a1018');
    ctx.fillStyle='rgba(246,215,168,0.35)'; roundRect(-3,-10,6,8,1,'rgba(246,215,168,0.25)');
    ctx.restore();
  }
  function drawNet(c,t){
    ctx.save(); ctx.translate(20,-6); ctx.rotate(-0.5);
    ctx.strokeStyle='#d4a574'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,8); ctx.lineTo(0,-10); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0,-16,8,7,0,0,Math.PI*2);
    ctx.strokeStyle='rgba(255,230,200,0.55)'; ctx.lineWidth=1.2; ctx.stroke();
    ctx.restore();
  }
  function drawCamera(c,t){
    ctx.save(); ctx.translate(18, -4); ctx.rotate(-0.15);
    roundRect(-8,-6,16,12,2,'#4a3a48');
    ctx.beginPath(); ctx.arc(0,0,4.5,0,Math.PI*2); ctx.fillStyle='#2a1e28'; ctx.fill();
    ctx.beginPath(); ctx.arc(0,0,2.2,0,Math.PI*2); ctx.fillStyle='#7ab'; ctx.fill();
    roundRect(-4,-9,6,3,1,'#6a5a68');

  }
  function drawPolaroid(c,t){
    // held up in front of cat when showing
    const show = c.showPhoto;
    ctx.save();
    if (show) {
      ctx.translate(0, -52 + Math.sin(t*2)*2);
      ctx.rotate(Math.sin(t*1.2+c.phase)*0.04);
      ctx.scale(1.55, 1.55);
    } else {
      ctx.translate(22, -10);
      ctx.rotate(-0.2);
      ctx.scale(0.85, 0.85);
    }
    // frame
    roundRect(-22,-28,44,50,3,'#fff8f0');
    ctx.strokeStyle='rgba(180,140,110,0.35)'; ctx.lineWidth=1; ctx.stroke();
    // photo area
    ctx.save();
    ctx.beginPath(); ctx.rect(-18,-24,36,32); ctx.clip();
    const im = c.photoImg;
    if (im && im.complete && im.naturalWidth) {
      const iw=im.naturalWidth, ih=im.naturalHeight;
      const s=Math.max(36/iw, 32/ih);
      const dw=iw*s, dh=ih*s;
      ctx.drawImage(im, -18+(36-dw)/2, -24+(32-dh)/2, dw, dh);
    } else {
      // cute placeholder
      const g=ctx.createLinearGradient(-18,-24,18,8);
      g.addColorStop(0,'#ffe0ec'); g.addColorStop(1,'#ffe8d0');
      ctx.fillStyle=g; ctx.fillRect(-18,-24,36,32);
      const kind = (c.photoPlaceholder|0) % 2;
      if (kind===0){
        // heart
        ctx.translate(0,-8); ctx.scale(1.1,1.1);
        ctx.beginPath(); ctx.moveTo(0,4);
        ctx.bezierCurveTo(0,0,-8,0,-8,6); ctx.bezierCurveTo(-8,12,0,16,0,20);
        ctx.bezierCurveTo(0,16,8,12,8,6); ctx.bezierCurveTo(8,0,0,0,0,4);
        ctx.fillStyle='rgba(255,120,150,0.75)'; ctx.fill();
      } else {
        // cat silhouette
        ctx.fillStyle='rgba(90,60,70,0.45)';
        ctx.beginPath(); ctx.ellipse(0,-6,8,7,0,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(0,-14,6,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-5,-18); ctx.lineTo(-3,-24); ctx.lineTo(-1,-18); ctx.fill();
        ctx.beginPath(); ctx.moveTo(5,-18); ctx.lineTo(3,-24); ctx.lineTo(1,-18); ctx.fill();
      }
    }
    ctx.restore();
    // caption strip
    ctx.fillStyle='rgba(140,90,70,0.55)';
    ctx.font='600 5px Manrope,sans-serif'; ctx.textAlign='center';
    ctx.fillText(c.photoCaption || '♥', 0, 16);
    ctx.restore();
  }
  function star(x,y,r,ri){
    ctx.beginPath();
    for(let i=0;i<10;i++){
      const a=-Math.PI/2+i*Math.PI/5; const rad=i%2?ri:r;
      const px=x+Math.cos(a)*rad, py=y+Math.sin(a)*rad;
      i?ctx.lineTo(px,py):ctx.moveTo(px,py);
    }
    ctx.closePath(); ctx.fill();
  }

  // ---- scene props ----
  function drawCake(t){
    const {x,y} = cake;
    ctx.save(); ctx.translate(x,y);
    // plate
    ctx.beginPath(); ctx.ellipse(0,18,70,10,0,0,Math.PI*2); ctx.fillStyle='rgba(255,240,220,0.15)'; ctx.fill();
    // layers
    roundRect(-48,0,96,18,4,'#f5d0b0');
    roundRect(-42,-14,84,16,4,'#ffe8d2');
    roundRect(-36,-26,72,14,4,'#f3c4b0');
    // cream drip
    ctx.fillStyle='#fff6ea';
    for(let i=-30;i<=30;i+=12){ ctx.beginPath(); ctx.arc(i,-10,5,0,Math.PI*2); ctx.fill(); }
    // strawberries
    [[-20,-28],[0,-30],[20,-28]].forEach(([sx,sy])=>{
      ctx.beginPath(); ctx.ellipse(sx,sy,5,6,0,0,Math.PI*2); ctx.fillStyle='#e85a6a'; ctx.fill();
    });
    // candles
    candles.forEach((c,i)=>{
      const cx=c.dx, cy=-40;
      roundRect(cx-2,cy,4,16,1,'#fff0d8');
      if (c.lit){
        const f=0.7+Math.sin(t*10+c.flame)*.3;
        const g=ctx.createRadialGradient(cx,cy-4,0,cx,cy-4,14);
        g.addColorStop(0,`rgba(255,200,80,${0.45*f})`); g.addColorStop(1,'rgba(255,100,40,0)');
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy-4,14,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(cx,cy-5,2.2,4.5,0,0,Math.PI*2);
        ctx.fillStyle=`rgba(255,210,100,${f})`; ctx.fill();
      } else {
        ctx.beginPath(); ctx.arc(cx,cy,1.6,0,Math.PI*2); ctx.fillStyle='#c45a4a'; ctx.fill();
      }
    });
    ctx.restore();
  }

  function drawFairyLights(t){
    const y = H*0.12;
    ctx.strokeStyle='rgba(246,215,168,0.18)'; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(W*0.08,y);
    for(let i=0;i<fairy.length;i++){
      const x = W*(0.1 + i/(fairy.length-1)*0.8);
      const yy = y + Math.sin(i*0.9)*14;
      ctx.lineTo(x,yy);
    }
    ctx.stroke();
    fairy.forEach((f,i)=>{
      const x = W*(0.1 + i/(fairy.length-1)*0.8);
      const yy = y + Math.sin(i*0.9)*14;
      if (!f.lit) {
        ctx.beginPath(); ctx.arc(x,yy,2.5,0,Math.PI*2); ctx.fillStyle='rgba(255,220,180,0.2)'; ctx.fill();
        return;
      }
      const tw = 0.55+Math.sin(t*3+f.tw)*0.35;
      const g=ctx.createRadialGradient(x,yy,0,x,yy,12);
      g.addColorStop(0,`rgba(255,210,140,${0.55*tw})`); g.addColorStop(1,'rgba(255,160,80,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,yy,12,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x,yy,2.8,0,Math.PI*2); ctx.fillStyle=`rgba(255,230,180,${tw})`; ctx.fill();
    });
  }

  function drawGlasses(t){
    const {x,y,fill} = glasses;
    [[-18,0],[18,0]].forEach(([dx], gi)=>{
      const gx=x+dx, gy=y;
      ctx.strokeStyle='rgba(255,230,210,0.45)'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(gx-8,gy-22); ctx.lineTo(gx-6,gy); ctx.lineTo(gx+6,gy); ctx.lineTo(gx+8,gy-22); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(gx,gy); ctx.lineTo(gx,gy+10); ctx.moveTo(gx-7,gy+10); ctx.lineTo(gx+7,gy+10); ctx.stroke();
      if (fill>0.02){
        const h = 18*Math.min(1,fill);
        ctx.beginPath();
        ctx.moveTo(gx-7.2, gy-2); ctx.lineTo(gx-6.2, gy-2-h); ctx.lineTo(gx+6.2, gy-2-h); ctx.lineTo(gx+7.2, gy-2);
        ctx.closePath();
        ctx.fillStyle='rgba(140,30,50,0.75)'; ctx.fill();
        // shimmer
        ctx.fillStyle=`rgba(255,180,160,${0.15+Math.sin(t*2+gi)*0.08})`;
        ctx.fillRect(gx-2, gy-2-h, 2, h);
      }
    });
  }

  function drawSnowman(t){
    if (snowman.parts < 0.05) return;
    const {x,y,parts} = snowman;
    ctx.save(); ctx.translate(x,y); ctx.globalAlpha = Math.min(1, parts);
    if (parts>0.2){ ctx.beginPath(); ctx.arc(0,10,16,0,Math.PI*2); ctx.fillStyle='#f5f0ea'; ctx.fill(); }
    if (parts>0.5){ ctx.beginPath(); ctx.arc(0,-8,12,0,Math.PI*2); ctx.fillStyle='#f8f4ef'; ctx.fill(); }
    if (parts>0.8){
      ctx.beginPath(); ctx.arc(0,-24,9,0,Math.PI*2); ctx.fillStyle='#fffaf5'; ctx.fill();
      ctx.fillStyle='#3a2430';
      ctx.beginPath(); ctx.arc(-3,-25,1.3,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(3,-25,1.3,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(0,-22); ctx.lineTo(8,-21); ctx.lineTo(0,-20); ctx.fillStyle='#e8915a'; ctx.fill();
      // scarf
      ctx.strokeStyle='#e85a6a'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(0,-16,8,0.2,Math.PI-0.2); ctx.stroke();
    }
    ctx.restore();
  }

  function makeCat(o){
    return Object.assign({
      blinkSpeed:2.2+Math.random()*1.5,
      blinkPhase:Math.random()*10,
      forceBlink:0, eyeMood:'happy', facing:1, scale:1,
      vx:0, asleep:false, lit:false, tailExtra:0, prop:null,
      state:'idle', timer:0, task:0
    }, o);
  }

  function popHearts(x,y,n){
    for(let i=0;i<n;i++){
      heartsFX.push({
        x:x+(Math.random()-0.5)*20, y:y+(Math.random()-0.5)*10,
        vx:(Math.random()-.5)*.4, vy:-(0.4+Math.random()*.7),
        life:1, s:4+Math.random()*6, rot:(Math.random()-.5)*.4
      });

  }
  function burst(x,y){
    for(let i=0;i<22;i++){
      const a=Math.random()*Math.PI*2, sp=.7+Math.random()*2.6;
      sparks.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-0.5,life:1,decay:.01+Math.random()*0.015,r:1+Math.random()*2.2,hue:Math.random()<0.5?30:350});

  function swapText(){
    const g = document.getElementById('greeting');
    const w = document.getElementById('warmLine');
    g.classList.add('swap'); w.classList.add('swap');
    setTimeout(()=>{
      greetIdx = (greetIdx+1) % GREETINGS.length;
      wishIdx = (wishIdx+1) % WISHES.length;
      g.textContent = GREETINGS[greetIdx];
      w.textContent = WISHES[wishIdx];
      g.classList.remove('swap'); w.classList.remove('swap');
    }, 800);
  }

  // Director: schedule scenes so activity stays varied
  const schedule = [
    { at: 2,  act:'signEnter' },
    { at: 6,  act:'lightFairy' },
    { at: 12, act:'lightCake' },
    { at: 18, act:'wine' },
    { at: 22, act:'photoShow' },
    { at: 24, act:'signSwap' },
    { at: 28, act:'spark' },
    { at: 34, act:'snowman' },
    { at: 40, act:'wakeSleepy' },
    { at: 48, act:'signSwap' },
    { at: 52, act:'photoShow' },
    { at: 55, act:'balloonPass' },
    { at: 62, act:'spark' },
    { at: 70, act:'signSwap' },
    { at: 78, act:'catsHug' },
    { at: 82, act:'photoShow' },
    { at: 96, act:'loop' }
  ];
  let schedIdx = 0;
  let worldT0 = 0;
  let loopBase = 0;

  function getCat(role){ return cats.find(c=>c.role===role); }

  function trigger(act){
    const sign = getCat('sign');
    const lamp = getCat('lamplighter');
    const wine = getCat('wine');
    const spark = getCat('spark');
    const snow = getCat('snow');
    const sleepy = getCat('sleepy');
    const balloon = getCat('balloon');

    if (act==='signEnter' && sign){
      sign.state='walk'; sign.targetX=W*0.22; sign.facing=1; sign.signText='С ДР!';
    }
    if (act==='signSwap' && sign){
      sign.state='walk'; sign.targetX = sign.x < W*0.5 ? W*0.72 : W*0.22;
      sign.facing = sign.targetX > sign.x ? 1 : -1;
      sign.signText = ['Для тебя','♥ Маша','24!','Ура!'][wishIdx % 4];
      sign.pendingSwap = true;
    }
    if (act==='lightFairy' && lamp){
      lamp.state='walk'; lamp.targetX=W*0.15; lamp.facing=-1; lamp.lit=true; lamp.task='fairy'; lamp.fairyI=0;
    }
    if (act==='lightCake' && lamp){
      lamp.state='walk'; lamp.targetX=W*0.5; lamp.facing = lamp.x<W*0.5?1:-1; lamp.lit=true; lamp.task='cake'; lamp.candleI=0;
    }
    if (act==='wine' && wine){
      wine.state='walk'; wine.targetX=W*0.18; wine.facing=1; wine.task='pour';
    }
    if (act==='spark' && spark){
      spark.state='walk'; spark.targetX = W*(0.3+Math.random()*0.4);
      spark.facing = spark.targetX>spark.x?1:-1; spark.task='cast';
    }
    if (act==='snowman' && snow){
      snow.state='walk'; snow.targetX=snowman.x-30; snow.facing=1; snow.task='build'; snowman.target=1;
    }
    if (act==='wakeSleepy' && sleepy){
      sleepy.asleep=false; sleepy.forceBlink=0.4; sleepy.state='stretch';
      sleepy.timer=0; popHearts(sleepy.x, sleepy.y-20, 4);
    }
    if (act==='balloonPass' && balloon){
      balloon.x=-60; balloon.y=H*(0.35+Math.random()*0.15); balloon.state='float'; balloon.facing=1;
    }
    if (act==='catsHug'){
      if (sign && spark){
        sign.state='walk'; sign.targetX=W*0.48; spark.state='walk'; spark.targetX=W*0.52;
        sign.pendingHug=true; spark.pendingHug=true;
      }
    }
    if (act==='photoShow'){
      const ph = getCat('photo');
      if (ph){
        ph.prop = 'polaroid';
        ph.photoImg = nextPhoto();
        ph.photoPlaceholder = photoIdx;
        ph.photoCaption = ['Для тебя','Маша ♥','Наш вечер','24'][photoIdx % 4];
        ph.showPhoto = false;
        ph.x = -100; ph.y = H*0.70; ph.facing = 1;
        ph.state = 'walk'; ph.targetX = W*0.50; ph.task = 'showPhoto';
      }
    }
    if (act==='loop'){
      // reset some props gently and restart schedule
      candles.forEach(c=>c.lit=false);
      fairy.forEach(f=>f.lit=false);
      glasses.fill=0; glasses.target=0;
      snowman.parts=0; snowman.target=0;
      if (sleepy){ sleepy.asleep=true; sleepy.state='sleep'; }
      if (lamp){ lamp.x=W+80; lamp.state='wait'; lamp.lit=false; }
      if (wine){ wine.x=-100; wine.state='wait'; }
      const ph = getCat('photo');
      if (ph){ ph.x=W+100; ph.state='wait'; ph.prop='camera'; ph.showPhoto=false; ph.pendingPhotoExit=false; }
      loopBase = performance.now()/1000;
      schedIdx = 0;
    }
  }

  function updateCats(dt, t){
    for (const c of cats){
      // walking
      if (c.state==='walk' && c.targetX!=null){
        const dir = Math.sign(c.targetX - c.x) || 1;
        c.facing = dir;
        c.x += dir * 55 * dt * (c.walkSpeed/6);
        if (Math.abs(c.x - c.targetX) < 3){
          c.x = c.targetX; c.state='idle';
          if (c.pendingSwap){ c.pendingSwap=false; swapText(); popHearts(c.x, c.y-30, 5); }
          if (c.pendingHug){ c.pendingHug=false; popHearts(c.x, c.y-25, 8); c.forceBlink=0.5; }
          if (c.task==='pour'){ glasses.target=1; c.task=null; c.state='pour'; c.timer=0; }
          if (c.task==='cast'){ burst(c.x + c.facing*20, c.y-40); c.task=null; popHearts(c.x,c.y-20,3); }
          if (c.task==='build'){ c.state='build'; c.timer=0; }
          if (c.task==='fairy'){ c.state='lightFairy'; c.timer=0; }
          if (c.task==='cake'){ c.state='lightCake'; c.timer=0; }
          if (c.task==='showPhoto'){ c.state='showPhoto'; c.timer=0; c.showPhoto=true; c.task=null; popHearts(c.x, c.y-40, 7); }
        }
      }

      if (c.role==='sign' && c.state==='idle'){
        // gentle idle near text, occasionally blink
        if (Math.random()<0.002) c.forceBlink=0.25;
      }

      if (c.role==='balloon' && c.state==='float'){
        c.x += 28*dt;
        c.y = H*0.4 + Math.sin(t*0.8+c.phase)*18;
        if (c.x > W+80){ c.x=-60; c.balloonColor = ['#ff8fab','#f6d7a8','#a8c4e8','#c9f0d0'][Math.floor(Math.random()*4)]; }
      }

      if (c.role==='snow' && c.state==='catch'){
        c.x += Math.sin(t*0.4+c.phase)*12*dt;
        // catch nearby snow occasionally
        if (Math.random()<0.03){
          const s = snow[Math.floor(Math.random()*snow.length)];
          if (s){ s.y = -10; s.x = Math.random()*W; popHearts(c.x, c.y-20, 1); }
        }
      }
      if (c.state==='build'){
        c.timer += dt;
        snowman.parts = Math.min(1, c.timer/4);
        if (c.timer>4.2){ c.state='idle'; popHearts(snowman.x, snowman.y-40, 6); }
      }

      if (c.state==='pour'){
        c.timer += dt;
        glasses.fill = Math.min(1, c.timer/3.5);
        if (c.timer>3.8){ c.state='idle'; popHearts(glasses.x, glasses.y-30, 4); }
      }

      if (c.state==='lightFairy'){
        c.timer += dt;
        const idx = Math.min(fairy.length-1, Math.floor(c.timer*2.2));
        // walk along lights
        c.x = W*(0.1 + idx/(fairy.length-1)*0.8);
        c.y = H*0.22;
        c.facing = 1; c.lit = true;
        for (let i=0;i<=idx;i++) fairy[i].lit = true;
        if (idx >= fairy.length-1 && c.timer>7){
          c.state='walk'; c.targetX=W*0.55; c.y=H*0.74; c.task='cake';
        }
      }

      if (c.state==='lightCake'){
        c.timer += dt;
        c.x = cake.x - 40 + Math.min(80, c.timer*22);
        c.y = cake.y - 10;
        const idx = Math.min(candles.length-1, Math.floor(c.timer*1.4));
        for (let i=0;i<=idx;i++) candles[i].lit = true;
        if (idx>=candles.length-1 && c.timer>4.5){
          c.state='walk'; c.targetX=W*0.62; c.y=H*0.74; c.lit=false; popHearts(cake.x, cake.y-50, 6);
        }
      }

      if (c.state==='showPhoto'){
        c.timer += dt;
        c.y = H*0.70 + Math.sin(t*2)*1.5;
        if (c.timer > 9){
          c.showPhoto = false;
          c.state = 'walk';
          c.targetX = W + 120;
          c.facing = 1;
          c.prop = 'camera';
          c.pendingPhotoExit = true;
        }
      }
      if (c.role==='photo' && c.pendingPhotoExit && c.state==='idle'){
        c.pendingPhotoExit = false;
        c.x = W + 100; c.prop = 'camera'; c.state = 'wait';
      }
      // if walked off after show
      if (c.role==='photo' && c.pendingPhotoExit && c.state==='walk' && c.targetX > W && Math.abs(c.x - c.targetX) < 3){
        c.x = c.targetX; c.state='idle';
      }

      if (c.state==='stretch'){
        c.timer += dt;
        c.tailExtra = Math.sin(c.timer*4)*0.5;
        c.y = H*0.28 - Math.sin(Math.min(1,c.timer)*Math.PI)*8;
        if (c.timer>2.5){ c.state='idle'; c.tailExtra=0; }
      }

      if (c.role==='sleepy' && c.asleep){
        c.y = H*0.28 + Math.sin(t*0.6)*1.5;
      }

      // rare random blink
      if (!c.asleep && Math.random()<0.0015) c.forceBlink=0.2;
    }

    // soft approach of snowman parts if targeted without builder finishing
    if (snowman.target && snowman.parts < snowman.target && getCat('snow').state!=='build'){
      snowman.parts += dt*0.05;
    }
  }

  function drawHeartFX(h){
    ctx.save(); ctx.translate(h.x,h.y); ctx.rotate(h.rot); ctx.scale(h.s/16,h.s/16);
    ctx.beginPath(); ctx.moveTo(0,4);
    ctx.bezierCurveTo(0,0,-8,0,-8,6); ctx.bezierCurveTo(-8,12,0,16,0,20);
    ctx.bezierCurveTo(0,16,8,12,8,6); ctx.bezierCurveTo(8,0,0,0,0,4);
    ctx.fillStyle=`rgba(255,140,160,${h.life*0.85})`; ctx.fill();
    ctx.restore();
  }

  function frame(now){
    if (!worldT0) worldT0 = now;
    const t = now*0.001;
    const dt = Math.min(0.033, (now - (lastT||now))/1000);
    lastT = now;
    const worldT = t - (loopBase||worldT0/1000);

    // director
    while (schedIdx < schedule.length && worldT >= schedule[schedIdx].at){
      trigger(schedule[schedIdx].act);
      schedIdx++;
    }

    ctx.clearRect(0,0,W,H);

    // ambient candle warmth orbs
    for (let i=0;i<3;i++){
      const bx=W*(0.25+i*0.25)+Math.sin(t*0.3+i)*30;
      const by=H*0.9+Math.sin(t*0.5+i)*8;
      const g=ctx.createRadialGradient(bx,by,0,bx,by,130);
      g.addColorStop(0,`rgba(255,150,80,${0.07+Math.sin(t+i)*0.015})`);
      g.addColorStop(1,'rgba(255,120,60,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(bx,by,140,0,Math.PI*2); ctx.fill();
    }

    drawFairyLights(t);

    // snow behind cats
    for (const s of snow){
      s.ph+=0.01; s.x+=s.vx+Math.sin(s.ph)*0.25; s.y+=s.vy*(dt*60);
      if (s.y>H+4){ s.y=-4; s.x=Math.random()*W; }
      if (s.x<-4)s.x=W+4; if(s.x>W+4)s.x=-4;
      ctx.beginPath(); ctx.fillStyle=`rgba(255,245,235,${s.a})`; ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
    }

    drawSnowman(t);
    drawGlasses(t);
    drawCake(t);

    updateCats(dt, t);

    // draw cats sorted by y for depth
    const sorted = cats.slice().sort((a,b)=>a.y-b.y);
    for (const c of sorted) drawCat(c, t);

    // hearts + sparks
    for (let i=heartsFX.length-1;i>=0;i--){
      const h=heartsFX[i]; h.x+=h.vx; h.y+=h.vy; h.life-=0.012; h.rot+=0.02;
      if (h.life<=0) heartsFX.splice(i,1); else drawHeartFX(h);
    }
    for (let i=sparks.length-1;i>=0;i--){
      const p=sparks[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.015; p.life-=p.decay;
      if (p.life<=0){ sparks.splice(i,1); continue; }
      ctx.beginPath();
      ctx.fillStyle=`hsla(${p.hue},90%,70%,${p.life*.9})`;
      ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2); ctx.fill();
    }

    requestAnimationFrame(frame);
  }

  addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
