<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>С днём рождения</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Comic+Neue:wght@700&family=Nunito:wght@700;800&family=Pacifico&family=Patrick+Hand&display=swap');
  :root{
    --paper:#f7f0e4; --paper2:#f0e6d6; --ink:#2a2a2a; --pink:#ff8fab; --blush:#ffb3c8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);
    font-family:Nunito,system-ui,sans-serif;cursor:none;user-select:none;-webkit-user-select:none}
  body.cursor-visible,body.cursor-visible *{cursor:default}
  body.cursor-visible #fsBtn{cursor:pointer}

  /* paper texture */
  body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.45'/%3E%3C/svg%3E")}

  #scene{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}

  .layout{position:fixed;inset:0;z-index:5;pointer-events:none;
    display:grid; grid-template-rows: auto auto auto 1fr;
    padding:2vh 3.5vw 24vh; gap:1vh}
  /* bottom 22vh reserved as cat floor — DOM never puts text there */

  .top{display:flex;flex-direction:column;align-items:center;gap:.8vh}
  .tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 7px;max-width:92vw}
  .tile{display:inline-flex;align-items:center;justify-content:center;
    min-width:1.15em; height:clamp(2.1rem,4.6vw,3.4rem); padding:0 .28em;
    border-radius:6px; box-shadow:2px 3px 0 rgba(0,0,0,.08), 0 1px 0 rgba(255,255,255,.5) inset;
    font-weight:800; line-height:1; transform:rotate(var(--r,0deg));
    border:1.5px solid rgba(0,0,0,.12)}
  .tile.space{visibility:hidden; min-width:.45em; border:none; box-shadow:none; background:none!important}
  .name-tiles{margin-top:.3vh}
  .name-tiles .tile{height:clamp(1.8rem,3.8vw,2.8rem); font-size:clamp(1.1rem,2.8vw,1.9rem)}

  .mid{display:grid; grid-template-columns: minmax(180px,28vw) minmax(200px,34vw) minmax(160px,22vw);
    gap:2vw; align-items:start; justify-content:center; width:min(1100px,94vw); margin:1vh auto 0;
    position:relative}
  .age-big{position:absolute; right:4%; top:-8%; font-family:Pacifico,Caveat,cursive;
    font-size:clamp(4rem,11vw,8rem); color:rgba(255,140,170,.22); line-height:1;
    text-shadow:2px 2px 0 rgba(255,255,255,.5); pointer-events:none; z-index:0}

  .polaroid{position:relative; z-index:2; background:#fffef8; padding:12px 12px 36px;
    width:100%; max-width:320px; margin:0 auto;
    box-shadow:4px 8px 0 rgba(0,0,0,.06), 0 12px 28px rgba(0,0,0,.08);
    transform:rotate(-2.5deg)}
  .washi{position:absolute; top:-12px; left:18%; width:64%; height:22px;
    background:repeating-linear-gradient(90deg,#ffb3c8 0 10px,#fff 10px 20px);
    border-radius:2px; box-shadow:0 2px 0 rgba(0,0,0,.06); transform:rotate(-1deg); opacity:.95}
  .polaroid .photo{width:100%; aspect-ratio:1; background:linear-gradient(160deg,#f3e8ef,#efe6dc);
    border:1px solid rgba(0,0,0,.06); overflow:hidden; position:relative;
    display:flex;align-items:center;justify-content:center}
  .polaroid .photo img{width:100%;height:100%;object-fit:cover;display:block}
  .polaroid .photo .ph{font-size:3rem; opacity:.35}
  .polaroid .cap{position:absolute; left:0; right:0; bottom:10px; text-align:center;
    font-family:Caveat,cursive; font-size:clamp(1.1rem,2vw,1.45rem); color:#5a3a48}
  .polaroid .cap .heart{color:#ff7aa2}

  .sticky{position:relative; z-index:2; background:#ffe3ea; width:100%; max-width:280px;
    margin:1.5vh auto 0; padding:1.1rem 1.15rem 1.3rem;
    box-shadow:3px 6px 0 rgba(0,0,0,.06), 0 10px 24px rgba(0,0,0,.06);
    transform:rotate(2deg); font-family:Caveat,cursive; font-size:clamp(1.05rem,1.9vw,1.4rem);
    line-height:1.35; color:#5a3a48; min-height:7.5rem}
  .sticky::before{content:'';position:absolute; top:-10px; left:50%; transform:translateX(-50%) rotate(-2deg);
    width:55%; height:16px; background:rgba(255,255,255,.55); border:1px solid rgba(0,0,0,.06)}
  .sticky .swap{transition:opacity .5s}
  .sticky .swap.hide{opacity:0}

  .date{text-align:center; font-family:Patrick Hand,Caveat,cursive;
    font-size:clamp(1rem,1.8vw,1.35rem); letter-spacing:.2em; color:#8a6a78; margin-top:1.2vh; position:relative; z-index:6}

  /* doodle stickers (DOM, fixed, never in floor) */
  .doodle{position:fixed; z-index:4; pointer-events:none; opacity:.9}
  .doodle svg{display:block}

  #fsBtn{position:fixed;right:max(12px,1.5vw);bottom:max(12px,1.5vh);z-index:40;
    display:flex;align-items:center;gap:8px;padding:9px 14px 9px 10px;
    border:2px solid rgba(0,0,0,.12);border-radius:999px;background:rgba(255,250,245,.92);
    color:#5a3a48;font:800 .82rem/1 Nunito,sans-serif;
    box-shadow:2px 4px 0 rgba(0,0,0,.06);opacity:0;transform:translateY(8px);
    transition:opacity .3s,transform .3s;pointer-events:none}
  #fsBtn.visible{opacity:1;transform:none;pointer-events:auto}
  body.is-fs #fsBtn{opacity:0!important;pointer-events:none!important}
  #fsBtn svg{width:22px;height:22px}
  .hint{position:fixed;bottom:2vh;left:50%;transform:translateX(-50%);z-index:6;
    font-size:.7rem;color:rgba(90,60,70,.35);transition:opacity 1s;pointer-events:none}
  .hint.fade{opacity:0}

  @media (max-width:900px){
    .mid{grid-template-columns:1fr 1fr; }
    .age-big{right:2%; top:-4%}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<!-- scrapbook stickers -->
<div class="doodle" style="top:8vh;left:3vw;transform:rotate(-12deg)" aria-hidden="true">
  <svg width="54" height="54" viewBox="0 0 54 54"><path d="M27 6c4 8 14 10 14 20 0 8-6 14-14 14S13 34 13 26C13 16 23 14 27 6z" fill="#ff8fab"/><circle cx="22" cy="24" r="2" fill="#fff"/><circle cx="32" cy="26" r="1.5" fill="#fff"/></svg>
</div>
<div class="doodle" style="top:6vh;right:4vw;transform:rotate(15deg)" aria-hidden="true">
  <svg width="48" height="48" viewBox="0 0 48 48"><path d="M24 4l3 9h10l-8 6 3 10-8-5-8 5 3-10-8-6h10z" fill="none" stroke="#2a2a2a" stroke-width="2.5" stroke-linejoin="round"/></svg>
</div>
<div class="doodle" style="top:38vh;left:2.5vw;transform:rotate(-6deg)" aria-hidden="true">
  <svg width="70" height="50" viewBox="0 0 70 50">
    <ellipse cx="22" cy="30" rx="14" ry="16" fill="#e85a5a"/><ellipse cx="42" cy="30" rx="14" ry="16" fill="#e85a5a"/>
    <path d="M8 18c4-10 14-8 14 0M48 18c-4-10-14-8-14 0" fill="none" stroke="#ff8fab" stroke-width="5" stroke-linecap="round"/>
    <circle cx="18" cy="26" r="2" fill="#fff"/><circle cx="38" cy="28" r="1.5" fill="#fff"/>
  </svg>
</div>
<div class="doodle" style="top:42vh;right:3vw;transform:rotate(8deg)" aria-hidden="true">
  <svg width="44" height="56" viewBox="0 0 44 56">
    <rect x="8" y="22" width="28" height="26" rx="6" fill="#fff0f5" stroke="#2a2a2a" stroke-width="2.5"/>
    <path d="M8 28c6-10 22-10 28 0" fill="#fff" stroke="#2a2a2a" stroke-width="2.5"/>
    <circle cx="22" cy="14" r="3" fill="#7ec8ff"/><rect x="20" y="4" width="4" height="12" rx="1" fill="#7ec8ff"/>
    <circle cx="14" cy="34" r="2" fill="#ff8fab"/><circle cx="28" cy="38" r="2" fill="#ffd36b"/><circle cx="20" cy="42" r="2" fill="#7ed6a8"/>
  </svg>
</div>

<div class="layout">
  <div class="top">
    <div class="tiles" id="titleTiles"></div>
    <div class="tiles name-tiles" id="nameTiles"></div>
  </div>

  <div class="mid">
    <div class="age-big" id="ageBig">24</div>
    <div class="polaroid" id="polaroid">
      <div class="washi"></div>
      <div class="photo" id="photoBox"><div class="ph">♡</div></div>
      <div class="cap"><span id="polaroidCap">Загадай желание!</span> <span class="heart">♥</span></div>
    </div>
    <div class="sticky" id="sticky"><span class="swap" id="stickyText"></span></div>
    <div></div>
  </div>

  <div class="date" id="dateLine"></div>
  <div></div>
</div>

<button id="fsBtn" type="button" aria-label="fullscreen">
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <ellipse cx="32" cy="42" rx="14" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="3"/>
    <circle cx="32" cy="28" r="12" fill="#fff" stroke="#2a2a2a" stroke-width="3"/>
    <path d="M24 18l3 8M40 18l-3 8" stroke="#2a2a2a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="27" cy="27" r="1.8" fill="#2a2a2a"/><circle cx="37" cy="27" r="1.8" fill="#2a2a2a"/>
    <path d="M28 32q4 3 8 0" fill="none" stroke="#2a2a2a" stroke-width="2" stroke-linecap="round"/>
    <path d="M20 10l12-6 12 6-3 5H23z" fill="#c5a3ff" stroke="#2a2a2a" stroke-width="2"/>
    <path d="M32 4l2 4-2 1-2-1z" fill="#ffd36b" stroke="#2a2a2a" stroke-width="1.5"/>
  </svg>
  <span id="fsLabel">На весь экран</span>
</button>
<div class="hint" id="hint"></div>

<script src="config.js"></script>
<script src="photos.js"></script>
<script>
(function(){
  const C = window.BDAY || {};
  const params = new URLSearchParams(location.search);
  const name = (params.get('name') || C.name || 'Маша').trim();
  const age = C.age || 24;
  const wishes = C.wishes || ['Сегодня всё про тебя ♥'];
  const compliments = C.compliments || ['С днём рождения!'];
  const photoCaptions = C.photoCaptions || ['Загадай желание!'];
  const TILE_COLORS = ['#ffd6e0','#d6f0ff','#efe0ff','#fff0b8','#d8f5e0','#ffe0c8','#e0e8ff','#ffd0f0'];
  const TILE_FONTS = ['Comic Neue,cursive','Nunito,sans-serif','Pacifico,cursive','Patrick Hand,cursive','Caveat,cursive'];

  function buildTiles(el, text){
    el.innerHTML = '';
    [...text].forEach((ch,i)=>{
      const s = document.createElement('span');
      s.className = 'tile' + (ch === ' ' ? ' space' : '');
      s.textContent = ch === ' ' ? '·' : ch;
      if (ch !== ' ') {
        s.style.background = TILE_COLORS[i % TILE_COLORS.length];
        s.style.fontFamily = TILE_FONTS[i % TILE_FONTS.length];
        s.style.setProperty('--r', ((i%5)-2)*2.2 + 'deg');
        s.style.fontSize = 'clamp(1.15rem,3.2vw,2.15rem)';
        s.style.color = '#2a2a2a';
      }
      el.appendChild(s);
    });
  }
  buildTiles(document.getElementById('titleTiles'), C.title || 'С ДНЁМ РОЖДЕНИЯ');
  buildTiles(document.getElementById('nameTiles'), (C.nameTiles || name).toUpperCase());
  document.getElementById('ageBig').textContent = String(age);
  document.getElementById('dateLine').textContent = C.dateLine || '';
  document.getElementById('polaroidCap').textContent = C.polaroidCaption || 'Загадай желание!';
  document.getElementById('stickyText').textContent = wishes[0];
  document.getElementById('fsLabel').textContent = (C.ui&&C.ui.fullscreen)||'На весь экран';
  document.getElementById('hint').textContent = (C.ui&&C.ui.hint)||'';
  document.title = 'С днём рождения, ' + name;

  /* photos */
  const PHOTO_LIST = (window.PHOTOS||[]).filter(Boolean);
  const photoImgs = PHOTO_LIST.map(s=>{const i=new Image(); i.src=s; return i;});
  let photoIdx = 0;
  const photoBox = document.getElementById('photoBox');
  function showPhotoInPolaroid(){
    const cap = photoCaptions[photoIdx % photoCaptions.length];
    document.getElementById('polaroidCap').textContent = cap;
    if (!photoImgs.length){
      photoBox.innerHTML = '<div class="ph">♡</div>';
      photoIdx++; return;
    }
    const im = photoImgs[photoIdx % photoImgs.length];
    photoIdx++;
    const img = document.createElement('img');
    img.alt = '';
    img.src = im.src;
    photoBox.innerHTML = '';
    photoBox.appendChild(img);
  }

  let wishIdx = 0;
  function swapSticky(){
    const el = document.getElementById('stickyText');
    el.classList.add('hide');
    setTimeout(()=>{
      wishIdx = (wishIdx+1)%wishes.length;
      el.textContent = wishes[wishIdx];
      el.classList.remove('hide');
    }, 450);
  }

  /* fullscreen */
  const fsBtn = document.getElementById('fsBtn');
  const isFs = ()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
  const enterFs = ()=>{ const el=document.documentElement; const r=el.requestFullscreen||el.webkitRequestFullscreen; if(r) return Promise.resolve(r.call(el)).catch(()=>{}); };
  const exitFs = ()=>{ const x=document.exitFullscreen||document.webkitExitFullscreen; if(x) return Promise.resolve(x.call(document)).catch(()=>{}); };
  const toggleFs = ()=> isFs()?exitFs():enterFs();
  const syncFs = ()=>{ document.body.classList.toggle('is-fs', isFs()); updateFs(); };
  ['fullscreenchange','webkitfullscreenchange'].forEach(e=>document.addEventListener(e,syncFs));
  fsBtn.addEventListener('click', e=>{ e.stopPropagation(); toggleFs(); });
  addEventListener('keydown', e=>{ if('fFаА'.includes(e.key)){ e.preventDefault(); toggleFs(); }});
  let lastClick=0;
  addEventListener('click', e=>{
    if(e.target.closest&&e.target.closest('#fsBtn')) return;
    const n=Date.now(); if(n-lastClick<400) toggleFs(); lastClick=n;
  });
  let idle;
  function showUi(){
    document.body.classList.add('cursor-visible'); updateFs(true);
    clearTimeout(idle); idle=setTimeout(()=>{ document.body.classList.remove('cursor-visible'); updateFs(false); },2000);
  }
  function updateFs(force){
    if(isFs()){ fsBtn.classList.remove('visible'); return; }
    if(force===false) fsBtn.classList.remove('visible'); else fsBtn.classList.add('visible');
  }
  ['mousemove','mousedown','touchstart','keydown'].forEach(e=>addEventListener(e,showUi,{passive:true}));
  showUi();
  setTimeout(()=>document.getElementById('hint').classList.add('fade'),5000);

  /* ===================== CANVAS CATS ===================== */
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d',{alpha:true});
  let W=0,H=0,dpr=1,last=0,t0=0,loopBase=0,schedIdx=0;
  let flakes=[], notes=[], hearts=[], sparks=[];
  const cats=[];
  let talkIdx=0;

  // Floor band: bottom ~20% — only place for walking cats
  const FLOOR_Y = () => H * 0.86;
  const FLOOR_TOP = () => H * 0.72; // cats should stay below this

  function resize(){
    dpr=Math.min(devicePixelRatio||1,2);
    W=innerWidth; H=innerHeight;
    canvas.width=(W*dpr)|0; canvas.height=(H*dpr)|0;
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    placeCats();
  }

  function makeCat(o){
    return Object.assign({
      x:0,y:0,facing:1,scale:1, phase:Math.random()*6,
      blinkT:2+Math.random()*3, blinkPhase:0, forceBlink:0,
      mouth:'omega', // omega | open
      hat:'#c5a3ff', hatStripe:'#7ec8ff',
      prop:null, state:'idle', timer:0, targetX:null, walkSpeed:5.5,
      bubble:null, bubbleT:0, sunglasses:false, peace:false
    }, o);
  }
  function getCat(r){ return cats.find(c=>c.role===r); }

  function placeCats(){
    cats.length=0;
    const fy = FLOOR_Y();

    // Confetti/snow thrower — top-left corner on a cloud, fully visible
    cats.push(makeCat({
      role:'thrower', x:Math.max(70, W*0.07), y:Math.max(90, H*0.115), scale:1.05, facing:1,
      hat:'#ffb3c8', hatStripe:'#fff', state:'throw', mouth:'open'
    }));

    // Even floor lineup (left → right), clear gaps, all below text
    const slots = [0.10,0.21,0.32,0.44,0.55,0.66,0.77,0.88];
    cats.push(makeCat({ role:'photo', x:W*slots[0], y:fy, scale:1.12, facing:1,
      hat:'#fff0b8', hatStripe:'#ff8fab', prop:'camera', state:'idle' }));
    cats.push(makeCat({ role:'balloon', x:W*slots[1], y:fy, scale:1.1, facing:1,
      hat:'#ffb3c8', hatStripe:'#ff8fab', prop:'heartBalloon', state:'idle' }));
    cats.push(makeCat({ role:'sign', x:W*slots[2], y:fy, scale:1.12, facing:1,
      hat:'#d6f0ff', hatStripe:'#7ec8ff', prop:'pencil', state:'idle' }));
    cats.push(makeCat({ role:'cake', x:W*slots[3], y:fy, scale:1.18, facing:1,
      hat:'#efe0ff', hatStripe:'#c5a3ff', prop:null, state:'idle', cakeLit:false }));
    cats.push(makeCat({ role:'talk', x:W*slots[4], y:fy, scale:1.12, facing:-1,
      hat:'#d8f5e0', hatStripe:'#7ed6a8', state:'idle', mouth:'open' }));
    cats.push(makeCat({ role:'dance', x:W*slots[5], y:fy, scale:1.15, facing:-1,
      hat:'#ffd6e0', hatStripe:'#ff8fab', state:'dance', mouth:'open' }));
    cats.push(makeCat({ role:'music', x:W*slots[6], y:fy, scale:1.1, facing:-1,
      hat:'#efe0ff', hatStripe:'#c5a3ff', prop:'guitar', state:'play' }));
    cats.push(makeCat({ role:'cool', x:W*slots[7], y:fy, scale:1.12, facing:-1,
      hat:'#fff0b8', hatStripe:'#ffd36b', sunglasses:true, peace:true, state:'idle', mouth:'omega' }));
  }

  /* ---- doodle cat draw (matches refs) ---- */
  function drawCat(c, t){
    const dance = c.state==='dance';
    const walk = c.state==='walk';
    const bob = dance ? Math.sin(t*8)*5 : (walk ? Math.sin(t*c.walkSpeed)*3 : Math.sin(t*1.3+c.phase)*1.2);
    const leg = dance ? Math.sin(t*8)*0.55 : (walk ? Math.sin(t*c.walkSpeed)*0.4 : 0);
    const s = c.scale * Math.min(W,H) / 900; // readable on projector
    const blink = c.forceBlink>0 || (t > c.blinkPhase && t < c.blinkPhase+0.12);
    if (t > c.blinkPhase + c.blinkT){ c.blinkPhase = t; c.blinkT = 2.2+Math.random()*3; }

    ctx.save();
    ctx.translate(c.x, c.y + bob);
    if (dance) ctx.rotate(Math.sin(t*5)*0.12);
    ctx.scale((c.facing||1)*s, s);

    // soft shadow
    ctx.beginPath(); ctx.ellipse(0, 8, 28, 7, 0, 0, Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,0.08)'; ctx.fill();

    // cloud seat for thrower
    if (c.role==='thrower'){
      ctx.fillStyle='rgba(255,255,255,0.95)';
      ctx.strokeStyle='#2a2a2a'; ctx.lineWidth=2.5;
      [[-28,14],[-8,8],[14,12],[32,16]].forEach(([dx,dy],i)=>{
        ctx.beginPath(); ctx.ellipse(dx, dy, 20-i, 12, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      });
    }

    // SHORT stubby tail
    ctx.save();
    ctx.translate(-22, -6);
    ctx.rotate(-0.5 + Math.sin(t*2.2+c.phase)*0.25);
    ctx.lineWidth=5; ctx.lineCap='round'; ctx.strokeStyle='#2a2a2a';
    ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(-6,-2,-5,-12); ctx.stroke();
    ctx.lineWidth=3.2; ctx.strokeStyle='#fff';
    ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(-6,-2,-5,-12); ctx.stroke();
    ctx.restore();

    // legs (stubby rounded)
    legPair(-12, leg); legPair(10, -leg);

    // body — white bean with thick wobbly outline
    wobbleEllipse(0, -18, 26, 22, '#fff', '#2a2a2a', 3.4);
    // belly ×
    ctx.strokeStyle='#9a9a9a'; ctx.lineWidth=2; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-4,-6); ctx.lineTo(4,2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(4,-6); ctx.lineTo(-4,2); ctx.stroke();

    // head
    wobbleEllipse(0, -48, 24, 22, '#fff', '#2a2a2a', 3.4);
    // ears
    ear(-14,-64, -0.15); ear(14,-64, 0.15);
    // forehead stripes (3 grey)
    ctx.strokeStyle='#9a9a9a'; ctx.lineWidth=2.4; ctx.lineCap='round';
    for (let i=-1;i<=1;i++){
      ctx.beginPath(); ctx.moveTo(i*5, -62); ctx.lineTo(i*5, -52); ctx.stroke();
    }

    // face
    if (c.sunglasses){
      // wayfarer
      ctx.fillStyle='#2a2a2a';
      roundRect(-16,-54,14,10,2,'#2a2a2a');
      roundRect(2,-54,14,10,2,'#2a2a2a');
      ctx.fillRect(-2,-50,4,2);
      ctx.strokeStyle='rgba(255,255,255,0.45)'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(-13,-52); ctx.lineTo(-7,-48); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(5,-52); ctx.lineTo(11,-48); ctx.stroke();
    } else if (blink){
      ctx.strokeStyle='#2a2a2a'; ctx.lineWidth=2.2; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(-10,-50); ctx.lineTo(-4,-50); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(4,-50); ctx.lineTo(10,-50); ctx.stroke();
    } else {
      ctx.fillStyle='#2a2a2a';
      ctx.beginPath(); ctx.arc(-7,-50,2.6,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(7,-50,2.6,0,Math.PI*2); ctx.fill();
    }
    // blush
    ctx.fillStyle='rgba(255,150,170,0.55)';
    ctx.beginPath(); ctx.ellipse(-14,-44,5,3.5,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(14,-44,5,3.5,0,0,Math.PI*2); ctx.fill();

    // mouth ω or open with tongue
    if (c.mouth==='open'){
      ctx.beginPath(); ctx.moveTo(-8,-40); ctx.quadraticCurveTo(0,-28,8,-40);
      ctx.closePath(); ctx.fillStyle='#2a2a2a'; ctx.fill();
      ctx.beginPath(); ctx.ellipse(0,-35,4.5,3.5,0,0,Math.PI*2); ctx.fillStyle='#ff8fab'; ctx.fill();
    } else {
      ctx.strokeStyle='#2a2a2a'; ctx.lineWidth=2.2; ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(-7,-39); ctx.quadraticCurveTo(-3,-35,0,-39);
      ctx.quadraticCurveTo(3,-35,7,-39); ctx.stroke();
    }
    // whiskers 3 lines each side
    ctx.strokeStyle='#2a2a2a'; ctx.lineWidth=1.5; ctx.lineCap='round';
    [[-12,-44,-24,-46],[-12,-41,-25,-41],[-12,-38,-24,-36],
     [12,-44,24,-46],[12,-41,25,-41],[12,-38,24,-36]].forEach(([a,b,c2,d])=>{
      ctx.beginPath(); ctx.moveTo(a,b); ctx.lineTo(c2,d); ctx.stroke();
    });

    // party hat with star
    drawHat(c, t);

    // peace sign paw
    if (c.peace){
      ctx.save(); ctx.translate(22,-20); ctx.rotate(-0.3);
      wobbleEllipse(0,0,8,7,'#fff','#2a2a2a',2.5);
      ctx.strokeStyle='#2a2a2a'; ctx.lineWidth=2.5; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(-2,-6); ctx.lineTo(-3,-16); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(3,-6); ctx.lineTo(5,-15); ctx.stroke();
      ctx.restore();
    }

    // props
    if (c.prop==='heartBalloon') drawHeartBalloon(c,t);
    if (c.prop==='guitar') drawGuitar(c,t);
    if (c.prop==='camera') drawCamera(c);
    if (c.prop==='pencil') drawPencil(c);
    if (c.prop==='mug') drawMug(c);

    // cake beside cake-cat
    if (c.role==='cake') drawMiniCake(c, t);

    ctx.restore();
    if (c.forceBlink>0) c.forceBlink-=0.016;
    if (c.bubble) drawBubble(c.x, c.y - 78*s, c.bubble);
  }

  function legPair(x, rot){
    ctx.save(); ctx.translate(x, 0); ctx.rotate(rot);
    wobbleEllipse(0, 4, 9, 8, '#fff', '#2a2a2a', 3); ctx.restore();
  }
  function ear(x,y,tilt){
    ctx.save(); ctx.translate(x,y); ctx.rotate(tilt);
    ctx.beginPath(); ctx.moveTo(-7,6); ctx.lineTo(0,-14); ctx.lineTo(7,6); ctx.closePath();
    ctx.fillStyle='#fff'; ctx.fill();
    ctx.strokeStyle='#2a2a2a'; ctx.lineWidth=3; ctx.lineJoin='round'; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-3,4); ctx.lineTo(0,-6); ctx.lineTo(3,4); ctx.closePath();
    ctx.fillStyle='#ffb3c8'; ctx.fill();
    ctx.restore();
  }
  function wobbleEllipse(x,y,rx,ry,fill,stroke,lw){
    ctx.beginPath();
    // slight wobble via multi-point
    for(let i=0;i<=16;i++){
      const a = (i/16)*Math.PI*2;
      const w = 1 + Math.sin(a*3+x)*0.03;
      const px = x+Math.cos(a)*rx*w, py=y+Math.sin(a)*ry*w;
      i?ctx.lineTo(px,py):ctx.moveTo(px,py);
    }
    ctx.closePath(); ctx.fillStyle=fill; ctx.fill();
    if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw; ctx.lineJoin='round'; ctx.stroke(); }
  }
  function roundRect(x,y,w,h,r,fill){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
    ctx.fillStyle=fill; ctx.fill();
  }
  function drawHat(c,t){
    ctx.save(); ctx.translate(0, -72); ctx.rotate(Math.sin(t*2+c.phase)*0.04);
    ctx.beginPath(); ctx.moveTo(0,-26); ctx.lineTo(14,6); ctx.lineTo(-14,6); ctx.closePath();
    ctx.fillStyle=c.hat; ctx.fill();
    ctx.strokeStyle='#2a2a2a'; ctx.lineWidth=3; ctx.lineJoin='round'; ctx.stroke();
    ctx.strokeStyle=c.hatStripe; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(-8,-4); ctx.lineTo(8,-4); ctx.stroke();
    // star topper
    ctx.fillStyle='#ffd36b';
    starPath(0,-28,7,3); ctx.fill();
    ctx.strokeStyle='#2a2a2a'; ctx.lineWidth=1.8; ctx.stroke();
    ctx.restore();
  }
  function starPath(x,y,r,ri){
    ctx.beginPath();
    for(let i=0;i<10;i++){
      const a=-Math.PI/2+i*Math.PI/5, rad=i%2?ri:r;
      const px=x+Math.cos(a)*rad, py=y+Math.sin(a)*rad;
      i?ctx.lineTo(px,py):ctx.moveTo(px,py);
    }
    ctx.closePath();
  }
  function drawHeartBalloon(c,t){
    ctx.save(); ctx.translate(28, -70 + Math.sin(t*1.4+c.phase)*4);
    ctx.beginPath(); ctx.moveTo(0,18); ctx.quadraticCurveTo(2,40,0,55);
    ctx.strokeStyle='#6a6a6a'; ctx.lineWidth=1.5; ctx.stroke();
    // heart
    ctx.beginPath();
    ctx.moveTo(0,8);
    ctx.bezierCurveTo(0,-4,-16,-4,-16,6);
    ctx.bezierCurveTo(-16,16,0,24,0,30);
    ctx.bezierCurveTo(0,24,16,16,16,6);
    ctx.bezierCurveTo(16,-4,0,-4,0,8);
    ctx.fillStyle='#ff8fab'; ctx.fill();
    ctx.strokeStyle='#2a2a2a'; ctx.lineWidth=2.8; ctx.stroke();
    // tiny ω face
    ctx.fillStyle='#2a2a2a';
    ctx.beginPath(); ctx.arc(-5,8,1.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(5,8,1.5,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#2a2a2a'; ctx.lineWidth=1.3;
    ctx.beginPath(); ctx.moveTo(-4,13); ctx.quadraticCurveTo(-2,15,0,13); ctx.quadraticCurveTo(2,15,4,13); ctx.stroke();
    ctx.restore();
  }
  function drawGuitar(c,t){
    ctx.save(); ctx.translate(8,-10); ctx.rotate(-0.45+Math.sin(t*2)*.04);
    wobbleEllipse(0,10,11,15,'#e8a050','#2a2a2a',2.5);
    ctx.beginPath(); ctx.arc(0,10,4,0,Math.PI*2); ctx.fillStyle='#5a3a28'; ctx.fill();
    roundRect(-2.5,-26,5,28,2,'#d49550');
    ctx.strokeStyle='#2a2a2a'; ctx.lineWidth=2; ctx.strokeRect(-2.5,-26,5,28);
    ctx.restore();
  }
  function drawCamera(c){
    ctx.save(); ctx.translate(26,-18);
    roundRect(-12,-8,24,16,3,'#5a5a68');
    ctx.strokeStyle='#2a2a2a'; ctx.lineWidth=2.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,6,0,Math.PI*2); ctx.fillStyle='#8ab'; ctx.fill();
    ctx.strokeStyle='#2a2a2a'; ctx.lineWidth=2; ctx.stroke();
    ctx.restore();
  }
  function drawPencil(c){
    ctx.save(); ctx.translate(24,-22); ctx.rotate(-0.7);
    roundRect(-2,-18,4,22,1,'#ffd36b');
    ctx.fillStyle='#f5c8a0'; ctx.fillRect(-2,-22,4,5);
    ctx.fillStyle='#2a2a2a'; ctx.beginPath(); ctx.moveTo(-2,-22); ctx.lineTo(0,-26); ctx.lineTo(2,-22); ctx.fill();
    ctx.restore();
  }
  function drawMug(c){
    ctx.save(); ctx.translate(22,-16);
    roundRect(-12,-8,20,18,3,'#fff');
    ctx.strokeStyle='#2a2a2a'; ctx.lineWidth=2.5; ctx.stroke();
    ctx.strokeStyle='#9a9a9a'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(-8,0); ctx.lineTo(4,0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(8,-2); ctx.arc(10,2,5,-Math.PI/2,Math.PI/2); ctx.strokeStyle='#2a2a2a'; ctx.lineWidth=2.5; ctx.stroke();
    ctx.restore();
  }
  function drawMiniCake(c,t){
    ctx.save(); ctx.translate(-40, -8);
    roundRect(-18,0,36,14,3,'#f5e0c0');
    ctx.strokeStyle='#2a2a2a'; ctx.lineWidth=2.5; ctx.stroke();
    // pink frosting drip
    ctx.fillStyle='#ffb3c8';
    ctx.beginPath(); ctx.moveTo(-18,0); ctx.lineTo(18,0);
    ctx.lineTo(18,6); ctx.quadraticCurveTo(10,14,6,6);
    ctx.quadraticCurveTo(0,14,-4,6); ctx.quadraticCurveTo(-12,14,-18,6); ctx.closePath();
    ctx.fill(); ctx.strokeStyle='#2a2a2a'; ctx.lineWidth=2.3; ctx.stroke();
    // sprinkles
    [['#7ec8ff',-8,2],['#ff8fab',2,3],['#ffd36b',10,1]].forEach(([col,x,y])=>{
      ctx.fillStyle=col; ctx.fillRect(x,y,3,1.5);
    });
    // candle
    roundRect(-2,-16,4,16,1,'#7ec8ff');
    ctx.strokeStyle='#2a2a2a'; ctx.lineWidth=2; ctx.stroke();
    if (c.cakeLit){
      const f=.7+Math.sin(t*10)*.3;
      ctx.beginPath(); ctx.ellipse(0,-20,3.5,5.5,0,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,200,80,${f})`; ctx.fill();
      ctx.strokeStyle='#2a2a2a'; ctx.lineWidth=1.5; ctx.stroke();
    }
    ctx.restore();
  }
  function drawBubble(x,y,text){
    const lines = wrap(text, 18);
    const bw = Math.min(240, 24+Math.max(...lines.map(l=>ctx.measureText?0:l.length))*10);
    // measure properly
    ctx.font='700 14px Nunito';
    let maxw=0; lines.forEach(l=> maxw=Math.max(maxw, ctx.measureText(l).width));
    const w = Math.max(120, maxw+28), h = 16+lines.length*18;
    ctx.save(); ctx.translate(x,y);
    roundRect(-w/2, -h, w, h, 14, 'rgba(255,253,248,0.96)');
    ctx.strokeStyle='#2a2a2a'; ctx.lineWidth=2.5; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-6,0); ctx.lineTo(0,10); ctx.lineTo(8,0); ctx.fillStyle='rgba(255,253,248,0.96)'; ctx.fill();
    ctx.strokeStyle='#2a2a2a'; ctx.beginPath(); ctx.moveTo(-6,0); ctx.lineTo(0,10); ctx.lineTo(8,0); ctx.stroke();
    ctx.fillStyle='#3a2a30'; ctx.textAlign='center';
    lines.forEach((ln,i)=> ctx.fillText(ln, 0, -h+20+i*18));
    ctx.restore();
  }
  function wrap(t,max){
    const w=String(t).split(/\s+/); const o=[]; let c='';
    for(const x of w){ if((c+' '+x).trim().length>max){ o.push(c.trim()); c=x;} else c+=(c?' ':'')+x; }
    if(c) o.push(c.trim()); return o.slice(0,3);
  }

  function spawnFromThrower(cat, n){
    for(let i=0;i<n;i++){
      const conf = Math.random()<0.45;
      flakes.push({
        conf,
        x: cat.x + 15 + Math.random()*20,
        y: cat.y + 10,
        vx: 0.4+Math.random()*1.2,
        vy: 0.6+Math.random()*1.4,
        r: conf ? 0 : 1.5+Math.random()*2.5,
        w: 5+Math.random()*6, h: 3+Math.random()*3,
        rot: Math.random()*6, vr:(Math.random()-.5)*.12,
        color: ['#ff8fab','#ffd36b','#7ec8ff','#c5a3ff','#7ed6a8'][Math.random()*5|0],
        a: 0.85
      });
    }
  }

  /* schedule — calm pacing */
  const schedule = [
    {at:3,  act:'lightCake'},
    {at:6,  act:'talk'},
    {at:12, act:'sticky'},
    {at:18, act:'photo'},
    {at:26, act:'talk'},
    {at:34, act:'sticky'},
    {at:42, act:'sparkle'},
    {at:48, act:'photo'},
    {at:56, act:'talk'},
    {at:64, act:'sticky'},
    {at:78, act:'photo'},
    {at:90, act:'loop'}
  ];

  function trigger(act){
    const cake=getCat('cake'), talk=getCat('talk'), sign=getCat('sign'), photo=getCat('photo'), dance=getCat('dance');
    if (act==='lightCake' && cake){ cake.cakeLit=true; cake.mouth='open'; popH(cake.x-40, cake.y-60, 4); }
    if (act==='talk' && talk){
      talkIdx=(talkIdx+1)%compliments.length;
      talk.bubble=compliments[talkIdx]; talk.bubbleT=5; talk.mouth='open';
      talk.state='walk'; talk.targetX = talk.x<W*0.55 ? W*0.66 : W*0.55;
    }
    if (act==='sticky' && sign){
      swapSticky(); sign.mouth='open'; sign.forceBlink=0.2; popH(sign.x, sign.y-50, 3);
      // walk slightly toward sticky (still on floor)
      sign.state='walk'; sign.targetX=W*0.36; sign.facing=1;
    }
    if (act==='photo' && photo){
      // walk toward under-polaroid zone (left-center floor), then update polaroid, then back
      photo.state='walk'; photo.targetX=W*0.20; photo.facing=1; photo.task='deliver'; photo.mouth='open';
    }
    if (act==='sparkle'){
      const d=getCat('dance'); if(d) popH(d.x, d.y-50, 5);
    }
    if (act==='loop'){
      if (cake) cake.cakeLit=false;
      if (photo){ photo.x=W*0.12; photo.state='idle'; photo.task=null; }
      loopBase=performance.now()/1000; schedIdx=0;
    }
  }

  function popH(x,y,n){
    for(let i=0;i<n;i++) hearts.push({
      x:x+(Math.random()-.5)*20,y:y,vx:(Math.random()-.5)*.4,vy:-(.4+Math.random()*.7),
      life:1,s:5+Math.random()*6,rot:(Math.random()-.5)*.3
    });
  }

  function update(dt,t){
    const fy = FLOOR_Y();
    for (const c of cats){
      if (c.role!=='thrower') c.y = fy; // lock to floor

      if (c.state==='walk' && c.targetX!=null){
        const dir=Math.sign(c.targetX-c.x)||1;
        c.facing=dir;
        c.x += dir * 55 * dt * (c.walkSpeed/6);
        // clamp to floor band x margins; never enter center text vertically (already on floor)
        c.x = Math.max(W*0.06, Math.min(W*0.94, c.x));
        if (Math.abs(c.x-c.targetX)<4){
          c.x=c.targetX; c.state='idle';
          if (c.task==='deliver'){
            showPhotoInPolaroid();
            popH(c.x, c.y-60, 5);
            c.task=null;
            c.state='walk'; c.targetX=W*0.12; c.facing=-1;
          }
        }
      }

      if (c.role==='thrower'){
        c.y = Math.max(90, H*0.115) + Math.sin(t*1.2)*2;
        if (Math.random()<0.2) spawnFromThrower(c, 1);
        c.mouth = Math.sin(t*3)>0 ? 'open' : 'omega';
      }

      if (c.state==='dance' && Math.random()<0.04){
        notes.push({x:c.x+(Math.random()-.5)*16,y:c.y-55,life:1,vy:-0.55,g:Math.random()<.5?'♪':'♫'});
      }
      if (c.role==='music' && Math.random()<0.035){
        notes.push({x:c.x-18,y:c.y-50,life:1,vy:-0.45,g:Math.random()<.5?'♩':'♬'});
      }
      if (c.bubbleT>0){ c.bubbleT-=dt; if(c.bubbleT<=0) c.bubble=null; }
    }

    // flakes
    for (let i=flakes.length-1;i>=0;i--){
      const f=flakes[i];
      f.x+=f.vx; f.y+=f.vy; f.rot+=f.vr; f.a-=0.0012;
      if (f.y>H+10 || f.a<=0){ flakes.splice(i,1); continue; }
    }
    if (flakes.length>140) flakes.splice(0, flakes.length-140);
  }

  function frame(now){
    if(!t0) t0=now;
    const t=now*0.001;
    const dt=Math.min(0.033,(now-(last||now))/1000); last=now;
    const worldT=t-(loopBase||t0/1000);

    while(schedIdx<schedule.length && worldT>=schedule[schedIdx].at){
      trigger(schedule[schedIdx].act); schedIdx++;
    }

    ctx.clearRect(0,0,W,H);

    // subtle floor stage shadow band
    const g=ctx.createLinearGradient(0,H*0.7,0,H);
    g.addColorStop(0,'rgba(0,0,0,0)');
    g.addColorStop(1,'rgba(180,140,120,0.08)');
    ctx.fillStyle=g; ctx.fillRect(0,H*0.7,W,H*0.3);

    update(dt,t);

    // particles behind cats
    for (const f of flakes){
      if (f.conf){
        ctx.save(); ctx.translate(f.x,f.y); ctx.rotate(f.rot);
        ctx.globalAlpha=f.a; ctx.fillStyle=f.color; ctx.fillRect(-f.w/2,-f.h/2,f.w,f.h);
        ctx.restore(); ctx.globalAlpha=1;
      } else {
        ctx.beginPath(); ctx.fillStyle=`rgba(255,255,255,${f.a})`;
        ctx.strokeStyle=`rgba(40,40,40,${f.a*0.25})`; ctx.lineWidth=0.8;
        ctx.arc(f.x,f.y,f.r,0,Math.PI*2); ctx.fill(); ctx.stroke();
      }
    }

    cats.slice().sort((a,b)=>a.y-b.y).forEach(c=>drawCat(c,t));

    for (let i=hearts.length-1;i>=0;i--){
      const h=hearts[i]; h.x+=h.vx; h.y+=h.vy; h.life-=0.015;
      if(h.life<=0){hearts.splice(i,1);continue;}
      ctx.save(); ctx.translate(h.x,h.y); ctx.rotate(h.rot); ctx.scale(h.s/14,h.s/14);
      ctx.beginPath(); ctx.moveTo(0,4);
      ctx.bezierCurveTo(0,0,-8,0,-8,6); ctx.bezierCurveTo(-8,12,0,16,0,20);
      ctx.bezierCurveTo(0,16,8,12,8,6); ctx.bezierCurveTo(8,0,0,0,0,4);
      ctx.fillStyle=`rgba(255,120,150,${h.life})`; ctx.fill(); ctx.restore();
    }
    for (let i=notes.length-1;i>=0;i--){
      const n=notes[i]; n.y+=n.vy; n.life-=0.012;
      if(n.life<=0){notes.splice(i,1);continue;}
      ctx.globalAlpha=n.life; ctx.fillStyle='#e89a4a'; ctx.font='700 18px Nunito';
      ctx.fillText(n.g,n.x,n.y); ctx.globalAlpha=1;
    }

    requestAnimationFrame(frame);
  }

  addEventListener('resize', resize);
  resize();
  // initial polaroid placeholder
  showPhotoInPolaroid(); photoIdx=0; // reset so first scheduled photo is first
  photoBox.innerHTML = '<div class="ph">♡</div>';
  document.getElementById('polaroidCap').textContent = C.polaroidCaption || 'Загадай желание!';
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
