<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="robots" content="noindex"/>
<title>С днём рождения</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Comic+Neue:wght@700&family=Nunito:wght@700;800&family=Pacifico&family=Patrick+Hand&display=swap');
:root{--ink:#2a2220;--pink:#ff8fab}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;color:var(--ink);
  font-family:Nunito,system-ui,sans-serif;cursor:none;user-select:none;-webkit-user-select:none;
  background:#1a1520}
body.cursor-visible,body.cursor-visible *{cursor:default}
body.cursor-visible #fsBtn{cursor:pointer}
#scene{position:fixed;inset:0;z-index:2;pointer-events:none}
.ui{position:fixed;inset:0;z-index:10;pointer-events:none}
.title-wrap{text-align:center;padding-top:1.2vh;position:relative;z-index:12}
.tiles{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:clamp(4px,.65vw,9px);max-width:96vw}
.tile{display:inline-flex;align-items:center;justify-content:center;
  min-width:1.12em;height:clamp(3.8rem,7.8vw,6.4rem);padding:0 .26em;border-radius:9px;
  box-shadow:3px 4px 0 rgba(20,10,20,.25),0 1px 0 rgba(255,255,255,.4) inset;
  font-weight:800;line-height:1;transform:rotate(var(--r,0deg));
  border:2.5px solid rgba(40,30,25,.18);font-size:clamp(2.1rem,5.8vw,4.2rem);color:#2a2220;
  text-shadow:0 1px 0 rgba(255,255,255,.3)}
.tile.space{visibility:hidden;min-width:.4em;border:none;box-shadow:none;background:none!important}
.name-tiles{margin-top:.35vh}
.name-tiles .tile{height:clamp(3rem,6vw,4.8rem);font-size:clamp(1.8rem,4.6vw,3.2rem)}
/* ONE polaroid — left, protected */
.polaroid{position:fixed;z-index:14;left:2.2vw;top:22vh;width:min(280px,22vw);
  background:#fffaf0;padding:12px 12px 38px;
  box-shadow:5px 10px 0 rgba(20,10,20,.18),0 16px 36px rgba(0,0,0,.2);
  transform:rotate(-2deg);pointer-events:none}
.washi{position:absolute;top:-12px;left:14%;width:70%;height:22px;
  background:repeating-linear-gradient(90deg,#ffb3c8 0 12px,#fff8f0 12px 24px);
  border-radius:2px;box-shadow:0 2px 0 rgba(0,0,0,.08);transform:rotate(-1deg)}
.polaroid .photo{width:100%;aspect-ratio:1;background:linear-gradient(160deg,#f5e6dc,#efe0d0);
  border:1.5px solid rgba(0,0,0,.08);overflow:hidden;display:flex;align-items:center;justify-content:center}
.polaroid .photo img{width:100%;height:100%;object-fit:cover}
.polaroid .photo .ph{font-size:2.8rem;opacity:.35}
.polaroid .cap{position:absolute;left:0;right:0;bottom:9px;text-align:center;
  font-family:Caveat,cursive;font-size:clamp(1.15rem,1.9vw,1.45rem);color:#5a3a40}
/* date — very bottom center, above everything cats */
.date{position:fixed;left:50%;bottom:1.6vh;transform:translateX(-50%);z-index:20;
  font-family:Patrick Hand,Caveat,cursive;font-size:clamp(1.25rem,2.4vw,1.75rem);
  letter-spacing:.2em;color:#f5e8d8;background:rgba(30,20,28,.72);padding:.4rem 1.25rem;border-radius:999px;
  border:1.5px solid rgba(255,220,180,.25);box-shadow:0 4px 16px rgba(0,0,0,.35);
  pointer-events:none;white-space:nowrap;backdrop-filter:blur(4px)}
#fsBtn{position:fixed;right:max(12px,1.4vw);bottom:max(12px,1.4vh);z-index:40;
  display:flex;align-items:center;gap:8px;padding:9px 14px 9px 10px;border:2px solid rgba(255,220,180,.25);
  border-radius:999px;background:rgba(40,28,36,.85);color:#f5e8d8;font:800 .82rem/1 Nunito,sans-serif;
  box-shadow:2px 4px 0 rgba(0,0,0,.2);opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s;pointer-events:none}
#fsBtn.visible{opacity:1;transform:none;pointer-events:auto}
body.is-fs #fsBtn{opacity:0!important;pointer-events:none!important}
#fsBtn svg{width:22px;height:22px}
.hint{position:fixed;bottom:7vh;left:50%;transform:translateX(-50%);z-index:6;
  font-size:.7rem;color:rgba(245,232,216,.35);transition:opacity 1s;pointer-events:none}
.hint.fade{opacity:0}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="ui">
  <div class="title-wrap">
    <div class="tiles" id="titleTiles"></div>
    <div class="tiles name-tiles" id="nameTiles"></div>
  </div>
</div>

<div class="polaroid" id="polaroid">
  <div class="washi"></div>
  <div class="photo" id="photoBox"><div class="ph">♡</div></div>
  <div class="cap"><span id="polaroidCap">Загадай желание!</span> ♥</div>
</div>
<div class="date" id="dateLine"></div>

<button id="fsBtn" type="button" aria-label="fullscreen">
  <svg viewBox="0 0 64 64"><ellipse cx="32" cy="42" rx="14" ry="11" fill="#fff" stroke="#2a2220" stroke-width="3"/>
  <circle cx="32" cy="28" r="12" fill="#fff" stroke="#2a2220" stroke-width="3"/>
  <path d="M20 10l12-6 12 6-3 5H23z" fill="#c5a3ff" stroke="#2a2220" stroke-width="2"/>
  <path d="M32 4l2 4-2 1-2-1z" fill="#ffd36b" stroke="#2a2220" stroke-width="1.5"/>
  <circle cx="27" cy="27" r="1.8" fill="#2a2220"/><circle cx="37" cy="27" r="1.8" fill="#2a2220"/></svg>
  <span id="fsLabel">На весь экран</span>
</button>
<div class="hint" id="hint"></div>

<script src="config.js"></script>
<script src="photos.js"></script>
<script src="drawCat.js"></script>
<script>
(function(){
const C=window.BDAY||{};
const params=new URLSearchParams(location.search);
const name=(params.get('name')||C.name||'Маша').trim();
const age=C.age||24;
const wishes=C.wishes||['♥'];
const compliments=C.compliments||[];
const photoCaptions=C.photoCaptions||['Загадай желание!'];
const lines=C.lines||{};
const greetings=C.paintedGreetings||wishes;
const COLORS=['#ffd0dc','#cfe8ff','#e8d4ff','#ffe6a8','#c8f0d8','#ffd8b8','#d8e0ff','#ffc8e8'];
const FONTS=['Comic Neue,cursive','Nunito,sans-serif','Pacifico,cursive','Patrick Hand,cursive','Caveat,cursive'];
const HATS=['#c5a3ff','#ff8fab','#7ec8ff','#ffd36b','#7ed6a8','#ffb3c8'];

function buildTiles(el,text){
  el.innerHTML='';
  [...text].forEach((ch,i)=>{
    const s=document.createElement('span');
    s.className='tile'+(ch===' '?' space':'');
    s.textContent=ch===' '?'·':ch;
    if(ch!==' '){
      s.style.background=COLORS[i%COLORS.length];
      s.style.fontFamily=FONTS[i%FONTS.length];
      s.style.setProperty('--r',((i%5)-2)*2+'deg');
    }
    el.appendChild(s);
  });
}
buildTiles(document.getElementById('titleTiles'),C.title||'С ДНЁМ РОЖДЕНИЯ');
buildTiles(document.getElementById('nameTiles'),(C.nameTiles||name).toUpperCase());
document.getElementById('dateLine').textContent=C.dateLine||'';
document.getElementById('polaroidCap').textContent=C.polaroidCaption||'Загадай желание!';
document.getElementById('fsLabel').textContent=(C.ui&&C.ui.fullscreen)||'На весь экран';
document.getElementById('hint').textContent=(C.ui&&C.ui.hint)||'';
document.title='С днём рождения, '+name;

const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d');
let W=0,H=0,dpr=1;
let t0=0,last=0,photoIdx=0;
const photoBox=document.getElementById('photoBox');
const PHOTOS=(window.PHOTOS||[]).filter(Boolean);

/* ---------- layout zones (fraction of W/H) ---------- */
const Z={
  // forbidden for cats
  titleBot:0.18,
  dateTop:0.90,
  polaroid:{x:0.01,y:0.20,w:0.24,h:0.40},
  // table
  table:{cx:0.52,cy:0.70,w:0.48,h:0.15},
  // foil balloons — right of table, mid height
  balloons:{x:0.78,y:0.50},
  // painted greeting board just above table
  paint:{x:0.36,y:0.36,w:0.34,h:0.14}
};

function forbiddenRects(){
  return [
    {x:0,y:0,w:W,h:H*Z.titleBot},
    {x:W*Z.polaroid.x,y:H*Z.polaroid.y,w:W*Z.polaroid.w,h:H*Z.polaroid.h},
    {x:W*0.28,y:H*Z.dateTop,w:W*0.44,h:H*0.08}
  ];
}
function inRect(x,y,r,pad){
  pad=pad||0;
  return x>r.x-pad&&x<r.x+r.w+pad&&y>r.y-pad&&y<r.y+r.h+pad;
}
function clampCat(c){
  // keep in front lanes — never into forbidden
  const pads=forbiddenRects();
  for(const r of pads){
    if(inRect(c.x,c.y-c.scale*0.5,r,c.scale*0.35)){
      // push out toward nearest edge
      const cx=r.x+r.w/2,cy=r.y+r.h/2;
      if(Math.abs(c.x-cx)/r.w > Math.abs(c.y-cy)/r.h){
        c.x = c.x<cx ? r.x-c.scale*0.55 : r.x+r.w+c.scale*0.55;
      } else {
        c.y = c.y<cy ? r.y-c.scale*0.2 : r.y+r.h+c.scale*0.35;
      }
    }
  }
  c.y=Math.min(H*0.88,Math.max(H*0.62,c.y)); // ground lanes only
  // never on tabletop
  const tableTop=H*(Z.table.cy-Z.table.h*0.2);
  const tw2=W*Z.table.w, tcx=W*Z.table.cx;
  if(c.y<tableTop+c.scale*0.15 && Math.abs(c.x-tcx)<tw2*0.55){
    c.y=tableTop+c.scale*0.35;
  }
  c.x=Math.min(W*0.96,Math.max(W*0.04,c.x));
}

/* ---------- snow ---------- */
let snow=[];
function initSnow(){
  snow=Array.from({length:70},()=>({
    x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2.2,
    vy:0.25+Math.random()*0.55,vx:(Math.random()-.5)*0.25,a:.25+Math.random()*.45
  }));
}

/* ---------- town houses ---------- */
let houses=[];
function initTown(){
  houses=[];
  const baseY=H*0.55;
  const specs=[
    {x:.08,w:90,h:110,col:'#3a2a48'},
    {x:.18,w:70,h:95,col:'#2e3a52'},
    {x:.28,w:100,h:130,col:'#4a3050'},
    {x:.72,w:85,h:115,col:'#353050'},
    {x:.84,w:95,h:100,col:'#2a3848'},
    {x:.93,w:70,h:125,col:'#403048'},
  ];
  specs.forEach((s,i)=>{
    const x=s.x*W, w=s.w*(W/1920), h=s.h*(H/1080);
    const wins=[];
    const cols=2+((i+1)%2), rows=2+(i%2);
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      wins.push({
        dx:(c+0.6)*w/(cols+0.5),
        dy:h*0.28+r*(h*0.28),
        lit:Math.random()>0.25,
        tw:Math.random()*10
      });
    }
    houses.push({x,y:baseY-h,w,h,col:s.col,wins,roof:i%2?'tri':'flat'});
  });
}

/* ---------- candles ---------- */
let candles=[];
function initCandles(){
  candles=[];
  const table=Z.table;
  // along table front edge
  for(let i=0;i<9;i++){
    candles.push({
      x:W*(table.cx-table.w*0.42+i*(table.w*0.84/8)),
      y:H*(table.cy-table.h*0.35),
      lit:true, life:80+Math.random()*60, max:100+Math.random()*50,
      phase:Math.random()*6, size:0.85+Math.random()*0.3, onTable:true
    });
  }
  // around scene floor
  const spots=[[.32,.82],[.38,.86],[.62,.84],[.68,.88],[.74,.80],[.30,.76],[.70,.76],[.45,.88],[.55,.90]];
  spots.forEach(([fx,fy])=>{
    candles.push({
      x:W*fx,y:H*fy,lit:Math.random()>0.3,
      life:40+Math.random()*80,max:90+Math.random()*50,
      phase:Math.random()*6,size:0.7+Math.random()*0.35,onTable:false
    });
  });
}

/* ---------- foil balloon 24 ---------- */
function drawFoilDigit(ctx, digit, x, y, s, t, phase){
  const bob=Math.sin(t*1.4+phase)*6;
  ctx.save();
  ctx.translate(x, y+bob);
  // string
  ctx.beginPath();
  ctx.moveTo(0,s*0.55);
  ctx.quadraticCurveTo(Math.sin(t+phase)*8, s*0.9, Math.sin(t*0.7+phase)*4, s*1.35);
  ctx.strokeStyle='rgba(230,210,180,.55)';
  ctx.lineWidth=1.6;
  ctx.stroke();
  // balloon body via rounded path approximating digit
  const g=ctx.createLinearGradient(-s*0.35,-s*0.5,s*0.35,s*0.5);
  if(digit==='2'){
    g.addColorStop(0,'#ff9ec8');g.addColorStop(0.45,'#ff5fa2');g.addColorStop(1,'#e02070');
  } else {
    g.addColorStop(0,'#b8a0ff');g.addColorStop(0.45,'#8a6cff');g.addColorStop(1,'#5a3ad0');
  }
  ctx.font=`800 ${s}px Nunito,sans-serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  // glossy fill
  ctx.lineJoin='round';
  // opaque underpaint so digits read across the room
  ctx.fillStyle=digit==='2'?'#ff4d94':'#7a5cff';
  ctx.fillText(digit,0,0);
  ctx.fillText(digit,0,0);
  ctx.fillStyle=g;
  ctx.fillText(digit,0,0);
  // chrome edge
  ctx.strokeStyle='rgba(255,255,255,.65)';
  ctx.lineWidth=s*0.08;
  ctx.strokeText(digit,0,0);
  ctx.strokeStyle='rgba(40,20,60,.55)';
  ctx.lineWidth=s*0.04;
  ctx.strokeText(digit,0,0);
  // highlight specular
  ctx.fillStyle='rgba(255,255,255,.55)';
  ctx.beginPath();
  ctx.ellipse(-s*0.12,-s*0.18,s*0.1,s*0.16,-0.5,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.25)';
  ctx.beginPath();
  ctx.ellipse(s*0.1,s*0.1,s*0.06,s*0.08,0.3,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

/* ---------- table + chairs ---------- */
function drawTable(){
  const cx=W*Z.table.cx, cy=H*Z.table.cy, tw=W*Z.table.w, th=H*Z.table.h;
  // chairs (behind table visually but drawn first — empty for couple)
  drawChair(cx-tw*0.32, cy+th*0.55, 1, (C.chairs&&C.chairs.left)||'Павел');
  drawChair(cx+tw*0.32, cy+th*0.55, -1, (C.chairs&&C.chairs.right)||'Маша');

  // table top — white cloth
  ctx.save();
  // legs
  ctx.fillStyle='#e8e0d4';
  ctx.fillRect(cx-tw*0.42, cy+th*0.15, 14, th*0.7);
  ctx.fillRect(cx+tw*0.42-14, cy+th*0.15, 14, th*0.7);
  ctx.strokeStyle='#2a2220';ctx.lineWidth=2;
  ctx.strokeRect(cx-tw*0.42, cy+th*0.15, 14, th*0.7);
  ctx.strokeRect(cx+tw*0.42-14, cy+th*0.15, 14, th*0.7);

  // chunky white tablecloth top
  ctx.beginPath();
  ctx.moveTo(cx-tw*0.52, cy-th*0.55);
  ctx.lineTo(cx+tw*0.52, cy-th*0.55);
  ctx.lineTo(cx+tw*0.50, cy+th*0.35);
  ctx.quadraticCurveTo(cx, cy+th*0.55, cx-tw*0.50, cy+th*0.35);
  ctx.closePath();
  ctx.fillStyle='#fffaf5';
  ctx.fill();
  ctx.strokeStyle='#2a2220';
  ctx.lineWidth=3.5;
  ctx.stroke();
  // cloth folds / pink runner
  ctx.fillStyle='rgba(255,180,200,.4)';
  ctx.fillRect(cx-tw*0.48, cy-th*0.2, tw*0.96, th*0.22);
  ctx.strokeStyle='rgba(42,34,32,.25)';
  ctx.lineWidth=2;
  ctx.strokeRect(cx-tw*0.48, cy-th*0.2, tw*0.96, th*0.22);
  // overhang scallops
  ctx.strokeStyle='#2a2220';ctx.lineWidth=2;
  for(let i=0;i<10;i++){
    const sx=cx-tw*0.45+i*(tw*0.9/9);
    ctx.beginPath();
    ctx.arc(sx, cy+th*0.35, 8, 0, Math.PI);
    ctx.stroke();
  }

  // plates
  [[-0.22,-0.05],[-0.08,-0.08],[0.08,-0.05],[0.22,-0.08]].forEach(([dx,dy])=>{
    ctx.beginPath();
    ctx.ellipse(cx+tw*dx, cy+th*dy, 22, 10, 0, 0, Math.PI*2);
    ctx.fillStyle='#f5efe6';
    ctx.fill();
    ctx.strokeStyle='#2a2220';ctx.lineWidth=2;ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(cx+tw*dx, cy+th*dy, 14, 6, 0, 0, Math.PI*2);
    ctx.strokeStyle='rgba(0,0,0,.12)';ctx.lineWidth=1.5;ctx.stroke();
  });

  // wine bottle Khvanchkara
  const bx=cx-tw*0.02, by=cy-th*0.55;
  ctx.fillStyle='#5a1424';
  ctx.fillRect(bx-10, by, 20, 48);
  ctx.fillRect(bx-5, by-18, 10, 20);
  ctx.strokeStyle='#2a2220';ctx.lineWidth=2.2;
  ctx.strokeRect(bx-10, by, 20, 48);
  ctx.strokeRect(bx-5, by-18, 10, 20);
  ctx.fillStyle='#f0d8b0';
  ctx.fillRect(bx-8, by+12, 16, 16);
  ctx.fillStyle='#5a1424';
  ctx.font='700 7px Nunito';
  ctx.textAlign='center';
  ctx.fillText(C.wine||'Хванчкара', bx, by+22);

  // two glasses
  [-28, 28].forEach((ox,i)=>{
    const gx=bx+ox, gy=by+20;
    ctx.beginPath();
    ctx.moveTo(gx-7, gy);
    ctx.lineTo(gx-5, gy+22);
    ctx.lineTo(gx+5, gy+22);
    ctx.lineTo(gx+7, gy);
    ctx.closePath();
    ctx.fillStyle='rgba(160,30,50,.75)';
    ctx.fill();
    ctx.strokeStyle='#2a2220';ctx.lineWidth=1.8;ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(gx, gy+22);ctx.lineTo(gx, gy+32);ctx.lineTo(gx+6, gy+32);
    ctx.stroke();
  });

  // cake
  const kx=cx+tw*0.18, ky=cy-th*0.55;
  ctx.fillStyle='#f5e0c0';
  ctx.fillRect(kx-28, ky, 56, 28);
  ctx.strokeStyle='#2a2220';ctx.lineWidth=2.2;ctx.strokeRect(kx-28, ky, 56, 28);
  ctx.fillStyle='#ff8fab';
  ctx.beginPath();
  ctx.ellipse(kx, ky, 30, 12, 0, 0, Math.PI*2);
  ctx.fill();ctx.stroke();
  // drips
  for(let i=-2;i<=2;i++){
    ctx.beginPath();
    ctx.ellipse(kx+i*10, ky+10, 5, 8, 0, 0, Math.PI*2);
    ctx.fill();
  }
  // cake candles
  [-12,0,12].forEach((ox,i)=>{
    ctx.fillStyle='#7ec8ff';
    ctx.fillRect(kx+ox-2, ky-22, 4, 18);
    ctx.strokeStyle='#2a2220';ctx.lineWidth=1.4;ctx.strokeRect(kx+ox-2, ky-22, 4, 18);
    const flick=0.85+Math.sin(performance.now()*0.01+i)*0.15;
    ctx.beginPath();
    ctx.ellipse(kx+ox, ky-26*flick, 4, 7*flick, 0, 0, Math.PI*2);
    ctx.fillStyle='#ffb347';ctx.fill();
  });

  // small flower vase
  const fx=cx-tw*0.32, fy=cy-th*0.4;
  ctx.fillStyle='#e8f0e0';
  ctx.fillRect(fx-8, fy, 16, 22);
  ctx.strokeStyle='#2a2220';ctx.lineWidth=2;ctx.strokeRect(fx-8, fy, 16, 22);
  ['#ff8fab','#ffd36b','#c5a3ff'].forEach((col,i)=>{
    ctx.beginPath();
    ctx.arc(fx+(i-1)*8, fy-8-i*2, 7, 0, Math.PI*2);
    ctx.fillStyle=col;ctx.fill();
    ctx.strokeStyle='#2a2220';ctx.lineWidth=1.5;ctx.stroke();
  });

  ctx.restore();
}

function drawChair(x,y,dir,label){
  ctx.save();
  ctx.translate(x,y);
  // back
  ctx.fillStyle='#d8cfc4';
  ctx.fillRect(-22, -55, 44, 50);
  ctx.strokeStyle='#2a2220';ctx.lineWidth=2.5;
  ctx.strokeRect(-22, -55, 44, 50);
  // seat
  ctx.fillStyle='#efe8de';
  ctx.beginPath();
  ctx.moveTo(-26,-8);ctx.lineTo(26,-8);ctx.lineTo(22,18);ctx.lineTo(-22,18);ctx.closePath();
  ctx.fill();ctx.stroke();
  // legs
  ctx.fillStyle='#cfc4b6';
  ctx.fillRect(-20,18,8,28);ctx.fillRect(12,18,8,28);
  ctx.strokeRect(-20,18,8,28);ctx.strokeRect(12,18,8,28);
  // name tag on back
  ctx.fillStyle='rgba(255,248,236,.9)';
  ctx.fillRect(-20,-48,40,14);
  ctx.strokeRect(-20,-48,40,14);
  ctx.fillStyle='#5a3a40';
  ctx.font='700 10px Nunito';
  ctx.textAlign='center';
  ctx.fillText(label,0,-38);
  ctx.restore();
}

function drawCandle(c,t){
  const s=10*c.size;
  ctx.save();
  ctx.translate(c.x,c.y);
  ctx.fillStyle='#fff8e8';
  ctx.fillRect(-s*0.35,-s*1.6,s*0.7,s*1.6);
  ctx.strokeStyle='#2a2220';ctx.lineWidth=1.8;
  ctx.strokeRect(-s*0.35,-s*1.6,s*0.7,s*1.6);
  if(c.lit){
    const flick=0.8+Math.sin(t*8+c.phase)*0.2;
    // glow
    const g=ctx.createRadialGradient(0,-s*2,0,0,-s*2,s*2.5);
    g.addColorStop(0,`rgba(255,200,100,${0.35*flick})`);
    g.addColorStop(1,'rgba(255,150,50,0)');
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(0,-s*2,s*2.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();
    ctx.ellipse(0,-s*2*flick,s*0.35,s*0.7*flick,0,0,Math.PI*2);
    ctx.fillStyle='#ffb347';ctx.fill();
    ctx.beginPath();
    ctx.ellipse(0,-s*2*flick,s*0.15,s*0.35*flick,0,0,Math.PI*2);
    ctx.fillStyle='#fff3a0';ctx.fill();
  } else {
    // smoke puff
    ctx.globalAlpha=0.25;
    ctx.beginPath();
    ctx.arc(2,-s*2.2,s*0.35,0,Math.PI*2);
    ctx.fillStyle='#888';ctx.fill();
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

/* ---------- town / sky ---------- */
function drawSky(t){
  const g=ctx.createLinearGradient(0,0,0,H*0.7);
  g.addColorStop(0,'#1a1430');
  g.addColorStop(0.35,'#3a2858');
  g.addColorStop(0.65,'#6a4060');
  g.addColorStop(1,'#c47858');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);
  // soft moon
  ctx.beginPath();
  ctx.arc(W*0.82,H*0.12,28,0,Math.PI*2);
  ctx.fillStyle='rgba(255,240,210,.55)';
  ctx.fill();
  const mg=ctx.createRadialGradient(W*0.82,H*0.12,10,W*0.82,H*0.12,60);
  mg.addColorStop(0,'rgba(255,230,180,.25)');
  mg.addColorStop(1,'rgba(255,200,120,0)');
  ctx.fillStyle=mg;
  ctx.beginPath();ctx.arc(W*0.82,H*0.12,60,0,Math.PI*2);ctx.fill();
}

function drawTown(t){
  // ground
  const gg=ctx.createLinearGradient(0,H*0.52,0,H);
  gg.addColorStop(0,'#3a2a38');
  gg.addColorStop(0.35,'#4a3228');
  gg.addColorStop(1,'#2a1c18');
  ctx.fillStyle=gg;
  ctx.fillRect(0,H*0.52,W,H*0.48);

  // distant hills
  ctx.fillStyle='#241828';
  ctx.beginPath();
  ctx.moveTo(0,H*0.55);
  for(let i=0;i<=20;i++){
    ctx.lineTo(W*i/20, H*0.52+Math.sin(i*0.7)*18);
  }
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();

  houses.forEach(h=>{
    ctx.fillStyle=h.col;
    ctx.fillRect(h.x,h.y,h.w,h.h);
    ctx.strokeStyle='rgba(0,0,0,.35)';
    ctx.lineWidth=2;ctx.strokeRect(h.x,h.y,h.w,h.h);
    // roof
    if(h.roof==='tri'){
      ctx.beginPath();
      ctx.moveTo(h.x-6,h.y);
      ctx.lineTo(h.x+h.w/2,h.y-h.h*0.28);
      ctx.lineTo(h.x+h.w+6,h.y);
      ctx.closePath();
      ctx.fillStyle='#1e1528';
      ctx.fill();
      ctx.stroke();
    } else {
      ctx.fillStyle='#1e1528';
      ctx.fillRect(h.x-4,h.y-10,h.w+8,12);
      ctx.strokeRect(h.x-4,h.y-10,h.w+8,12);
    }
    h.wins.forEach(w=>{
      const lit=w.lit;
      const tw=.7+Math.sin(t*1.5+w.tw)*.3;
      ctx.fillStyle=lit?`rgba(255,200,100,${0.75*tw})`:'#1a1520';
      ctx.fillRect(h.x+w.dx, h.y+w.dy, 12, 14);
      ctx.strokeStyle='rgba(0,0,0,.4)';
      ctx.lineWidth=1;ctx.strokeRect(h.x+w.dx, h.y+w.dy, 12, 14);
      if(lit){
        const g=ctx.createRadialGradient(h.x+w.dx+6,h.y+w.dy+7,0,h.x+w.dx+6,h.y+w.dy+7,20);
        g.addColorStop(0,`rgba(255,190,100,${0.25*tw})`);
        g.addColorStop(1,'rgba(255,150,50,0)');
        ctx.fillStyle=g;
        ctx.beginPath();ctx.arc(h.x+w.dx+6,h.y+w.dy+7,20,0,Math.PI*2);ctx.fill();
      }
    });
  });

  // string lights between houses
  drawTownLights(t);
}

function drawTownLights(t){
  const y0=H*0.42;
  const pts=[[W*0.12,y0],[W*0.25,y0+8],[W*0.4,y0-4],[W*0.7,y0+6],[W*0.85,y0],[W*0.95,y0+10]];
  ctx.strokeStyle='rgba(180,140,80,.35)';
  ctx.lineWidth=1.4;
  ctx.beginPath();
  pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
  ctx.stroke();
  // bulbs along
  for(let i=0;i<24;i++){
    const u=i/23;
    // sample polyline roughly
    const seg=u*(pts.length-1);
    const i0=Math.floor(seg), i1=Math.min(pts.length-1,i0+1);
    const f=seg-i0;
    const x=pts[i0][0]*(1-f)+pts[i1][0]*f;
    const y=pts[i0][1]*(1-f)+pts[i1][1]*f+Math.sin(i)*3;
    const tw=.5+Math.sin(t*2.5+i)*.45;
    const g=ctx.createRadialGradient(x,y,0,x,y,12);
    g.addColorStop(0,`rgba(255,210,120,${.65*tw})`);
    g.addColorStop(1,'rgba(255,160,60,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,12,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(x,y,2.4,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,230,170,${tw})`;ctx.fill();
  }
}

/* ---------- painted greeting ---------- */
const paint={
  idx:0, progress:0, // 0 paint, 1 hold, 2 wipe
  progress:0, // 0..1 along strokes
  holdT:0, wipeT:0,
  strokes:[], // computed from text
  color:'#2a2220'
};
function buildStrokes(text){
  // approximate letter strokes as polylines for chalk reveal
  const strokes=[];
  // use measure on offscreen feel — fake glyph paths as simple stick forms
  const fontSize=Math.min(54, W*0.032);
  ctx.save();
  ctx.font=`700 ${fontSize}px Caveat,cursive`;
  const tw=ctx.measureText(text).width;
  const x0=W*Z.paint.x + (W*Z.paint.w-tw)/2;
  const y0=H*Z.paint.y + H*Z.paint.h*0.55;
  let x=x0;
  for(const ch of text){
    const w=ctx.measureText(ch).width;
    if(ch!==' '){
      // each letter = 2-3 stroke segments
      const h=fontSize;
      strokes.push({
        pts:[
          {x:x+w*0.15,y:y0-h*0.35},
          {x:x+w*0.5,y:y0-h*0.55},
          {x:x+w*0.85,y:y0-h*0.3},
          {x:x+w*0.7,y:y0+h*0.15},
          {x:x+w*0.25,y:y0+h*0.2}
        ],
        ch, x, y:y0, w, h, fontSize
      });
    }
    x+=w;
  }
  ctx.restore();
  return strokes;
}
function drawPaintBoard(){
  const x=W*Z.paint.x, y=H*Z.paint.y, w=W*Z.paint.w, h=H*Z.paint.h;
  ctx.save();
  // warm wall plaque
  ctx.fillStyle='rgba(255,236,210,.55)';
  ctx.strokeStyle='rgba(42,34,32,.45)';
  ctx.lineWidth=3;
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(x,y,w,h,12); else ctx.rect(x,y,w,h);
  ctx.fill();ctx.stroke();
  // washi corners
  ctx.fillStyle='#ffb3c8';
  [[x+8,y-4],[x+w-36,y-4]].forEach(([tx,ty])=>{
    ctx.fillRect(tx,ty,28,12);
    ctx.strokeRect(tx,ty,28,12);
  });
  ctx.restore();
}
function drawPainted(t){
  drawPaintBoard();

  if(!paint.strokes.length) return;
  const n=paint.strokes.length;
  const reveal=paint.phase===0?paint.progress: paint.phase===1?1: Math.max(0,1-paint.wipeT);
  const count=Math.floor(reveal*n);
  const frac=reveal*n-count;
  ctx.save();
  for(let i=0;i<count;i++){
    drawChalkLetter(paint.strokes[i],1);
  }
  if(count<n && frac>0 && paint.phase!==2){
    drawChalkLetter(paint.strokes[count],frac);
  }
  if(paint.phase===2){
    // wipe veil
    const wx=W*Z.paint.x + paint.wipeT*W*Z.paint.w;
    ctx.fillStyle='rgba(58,40,70,.15)';
    ctx.fillRect(W*Z.paint.x, H*Z.paint.y, paint.wipeT*W*Z.paint.w, H*Z.paint.h);
  }
  ctx.restore();
}
function drawChalkLetter(s,alpha){
  ctx.save();
  ctx.globalAlpha=Math.min(1,alpha*1.2);
  // chalky fill of glyph
  ctx.font=`700 ${s.fontSize}px Caveat,cursive`;
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  // spray / chalk texture via multiple offset strokes
  const cols=['#2a2220','#3a3038','#1a1518'];
  for(let i=0;i<3;i++){
    ctx.fillStyle=cols[i];
    ctx.globalAlpha=0.35*alpha;
    ctx.fillText(s.ch, s.x+(i-1)*0.6, s.y+(i%2)*0.5);
  }
  ctx.globalAlpha=alpha;
  ctx.fillStyle='#2a2220';
  // clip by progress along letter using partial width
  if(alpha<1){
    ctx.beginPath();
    ctx.rect(s.x-2, s.y-s.h, s.w*alpha+4, s.h+8);
    ctx.clip();
  }
  ctx.fillText(s.ch, s.x, s.y);
  // chalk dust
  if(alpha>0.3&&alpha<1){
    for(let k=0;k<4;k++){
      ctx.fillStyle='rgba(40,30,35,.25)';
      ctx.beginPath();
      ctx.arc(s.x+s.w*alpha+(Math.random()-0.5)*6, s.y-Math.random()*s.h*0.5, 1.2,0,Math.PI*2);
      ctx.fill();
    }
  }
  ctx.restore();
}

/* ---------- cats ---------- */
let cats=[];
function makeCat(role, lane){
  return {
    role, lane,
    x:lane.x*W, y:lane.y*H,
    homeX:lane.x*W, homeY:lane.y*H,
    targetX:null, targetY:null,
    scale:lane.scale||58,
    facing:1, phase:Math.random()*10,
    mouth:'omega', hat:lane.hat!==false, hatColor:HATS[Math.floor(Math.random()*HATS.length)],
    prop:lane.prop||null, glasses:!!lane.glasses,
    state:'idle', walkPhase:0, blink:0, blinkT:2+Math.random()*4,
    bubble:null, bubbleT:0, paintColor:'#2a2220',
    task:null
  };
}

function initCats(){
  // lanes carefully avoid polaroid (left) and stay mid-lower
  cats=[
    makeCat('painter',  {x:.40,y:.66,scale:64,prop:'brush',hat:true}),
    makeCat('lamplighter',{x:.62,y:.78,scale:58,prop:'lighter',hat:true}),
    makeCat('waiterA',  {x:.34,y:.76,scale:56,prop:'plate',hat:true}),
    makeCat('waiterB',  {x:.68,y:.76,scale:56,prop:'wine',hat:true}),
    makeCat('flowers',  {x:.50,y:.82,scale:54,prop:'flowers',hat:true}),
    makeCat('photo',    {x:.28,y:.72,scale:56,prop:'camera',hat:true}),
    makeCat('host',     {x:.74,y:.70,scale:60,prop:null,hat:true}),
    makeCat('cool',     {x:.78,y:.80,scale:54,prop:'peace',glasses:true,hat:false}),
  ];
}

function getCat(role){return cats.find(c=>c.role===role);}

function walkTo(c,x,y,speed){
  c.state='walk';
  c.targetX=x;c.targetY=y;
  c.walkSpeed=speed||80;
}

function updateCat(c,dt,t){
  c.blinkT-=dt;
  if(c.blinkT<=0){c.blink=1;c.blinkT=2+Math.random()*5;}
  if(c.blink>0)c.blink=Math.max(0,c.blink-dt*3);

  if(c.bubbleT>0){c.bubbleT-=dt;if(c.bubbleT<=0)c.bubble=null;}

  if(c.state==='walk'&&c.targetX!=null){
    const dx=c.targetX-c.x, dy=(c.targetY!=null?c.targetY:c.y)-c.y;
    const dist=Math.hypot(dx,dy)||1;
    c.facing=dx>=0?1:-1;
    c.walkPhase=(c.walkPhase||0)+dt*8;
    const sp=(c.walkSpeed||70)*dt;
    if(dist<=sp){
      c.x=c.targetX;c.y=c.targetY!=null?c.targetY:c.y;
      c.state='idle';c.targetX=null;c.walkPhase=0;
      if(c.onArrive){const fn=c.onArrive;c.onArrive=null;fn();}
    } else {
      c.x+=dx/dist*sp;c.y+=dy/dist*sp;
    }
  }
  clampCat(c);
}

function drawBubble(x,y,text){
  ctx.font='700 13px Nunito';
  const w=Math.max(90, ctx.measureText(text).width+22), h=28;
  ctx.save();
  ctx.translate(x,y);
  ctx.fillStyle='rgba(255,248,236,.95)';
  ctx.strokeStyle='#2a2220';ctx.lineWidth=2;
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(-w/2,-h,w,h,8); else ctx.rect(-w/2,-h,w,h);
  ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(-4,0);ctx.lineTo(0,8);ctx.lineTo(4,0);ctx.fill();ctx.stroke();
  ctx.fillStyle='#2a2220';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(text,0,-h/2);
  ctx.restore();
}

/* ---------- lamplighter AI ---------- */
let lightTarget=null;
function updateLamplighter(dt,t){
  const c=getCat('lamplighter');
  if(!c)return;
  // burn down candles
  candles.forEach(cd=>{
    if(cd.lit){
      cd.life-=dt;
      if(cd.life<=0){cd.lit=false;cd.life=0;}
    }
  });
  if(c.state==='walk')return;
  if(c.task==='lighting'){
    // finish
    if(lightTarget){
      lightTarget.lit=true;
      lightTarget.life=lightTarget.max*(0.7+Math.random()*0.5);
      c.bubble=lines.light||'Сейчас зажгу';
      c.bubbleT=2.5;
      lightTarget=null;
      c.task=null;
      c.prop='lighter';
    }
    return;
  }
  // find unlit candle farthest from polaroid / nearest to cat
  const unlit=candles.filter(cd=>!cd.lit);
  if(!unlit.length){
    // wander near table right
    if(Math.random()<0.01){
      walkTo(c, W*(0.55+Math.random()*0.2), H*(0.76+Math.random()*0.1), 55);
    }
    return;
  }
  unlit.sort((a,b)=>Math.hypot(a.x-c.x,a.y-c.y)-Math.hypot(b.x-c.x,b.y-c.y));
  const target=unlit[0];
  lightTarget=target;
  c.task='lighting';
  c.prop='lighter';
  walkTo(c, target.x, target.y+8, 65);
  c.onArrive=()=>{c.task='lighting'; /* resolved next tick */};
}

/* ---------- painter AI ---------- */
function startPaintCycle(){
  paint.idx=paint.idx%greetings.length;
  paint.strokes=buildStrokes(greetings[paint.idx]);
  paint.phase=0;paint.progress=0;paint.holdT=0;paint.wipeT=0;
  const p=getCat('painter');
  if(p){
    p.prop='brush';
    p.paintColor='#2a2220';
    walkTo(p, W*(Z.paint.x+0.05), H*0.66, 70);
    p.bubble=greetings[paint.idx].slice(0,18)+(greetings[paint.idx].length>18?'…':''),
    p.bubbleT=3;
  }
}
function updatePainter(dt){
  const p=getCat('painter');
  if(!p)return;
  if(paint.phase===0){
    // paint stroke by stroke
    paint.progress=Math.min(1, paint.progress+dt*(params.get('fast')?0.35:0.12)); // ~8s (faster if ?fast=1)
    if(p.state!=='walk'){
      // pace along text while painting
      const u=paint.progress;
      p.x=W*(Z.paint.x+0.04+u*0.28);
      p.y=H*0.66; // keep feet on ground under board
      p.facing=1;
      p.prop='brush';
      clampCat(p);
    }
    if(paint.progress>=1){
      paint.phase=1;paint.holdT=0;
      p.prop=null;p.mouth='happy';
      p.bubble=compliments[paint.idx%compliments.length]||'♥';
      p.bubbleT=4;
    }
  } else if(paint.phase===1){
    paint.holdT+=dt;
    const holdMax=(params.get('fast')?12:150); if(paint.holdT>holdMax){ // ~2.5 min (12s if ?fast=1)
      paint.phase=2;paint.wipeT=0;
      if(p){p.prop='cloth';p.mouth='omega';
        walkTo(p, W*Z.paint.x, H*0.66, 70);
      }
    }
  } else if(paint.phase===2){
    paint.wipeT=Math.min(1, paint.wipeT+dt*(params.get('fast')?0.6:0.25));
    if(p&&p.state!=='walk'){
      p.x=W*(Z.paint.x+paint.wipeT*Z.paint.w*0.9); p.y=H*0.66;
      p.prop='cloth';
      clampCat(p);
    }
    if(paint.wipeT>=1){
      paint.idx=(paint.idx+1)%greetings.length;
      startPaintCycle();
    }
  }
}

/* ---------- calm waiter scheduler ---------- */
const ACTS=[
  {id:'welcome',dur:40,fn(){const h=getCat('host');if(h){h.bubble=lines.welcome||'Добро пожаловать';h.bubbleT=5;h.mouth='open';}}},
  {id:'pour',dur:45,fn(){
    const w=getCat('waiterB');if(!w)return;
    w.prop='wine';w.bubble=lines.pour||'Хванчкара для вас';w.bubbleT=4;
    walkTo(w, W*Z.table.cx, H*(Z.table.cy+0.08), 60);
    w.onArrive=()=>{w.mouth='open';};
  }},
  {id:'serve',dur:45,fn(){
    const w=getCat('waiterA');if(!w)return;
    w.prop='plate';w.bubble=lines.serve||'Горячее с пылу';w.bubbleT=4;

  }},
  {id:'flowers',dur:40,fn(){

    f.prop='flowers';f.bubble=lines.flowers||'Цветы поправила';f.bubbleT=4;
    walkTo(f, W*(Z.table.cx-0.28), H*(Z.table.cy+0.05), 55);
  }},
  {id:'photo',dur:50,fn(){

    p.prop='camera';p.bubble=lines.photo||'Улыбочку';p.bubbleT=4;
    walkTo(p, W*0.34, H*0.72, 60);
    p.onArrive=()=>{showPhoto();p.mouth='open';};

  {id:'toast',dur:40,fn(){

    const h=getCat('host');if(h){h.bubble=lines.toast||C.toast||'За Машу!';h.bubbleT=5;}
  }},
  {id:'cool',dur:35,fn(){
    const c=getCat('cool');if(c){c.prop='peace';c.glasses=true;c.bubble='Круто, '+name;c.bubbleT=4;}
  }},
  {id:'cake',dur:40,fn(){

      walkTo(w, W*(Z.table.cx+0.15), H*(Z.table.cy+0.08), 55);

  }},
  {id:'idle',dur:55,fn(){

      if(c.role==='painter'||c.role==='lamplighter')return;

    });

  {id:'bow',dur:35,fn(){
    cats.forEach(c=>{c.mouth='happy';});

  }}
];

let actIdx=0, actT0=0, actVar=0;
function startAct(i){
  actIdx=((i%ACTS.length)+ACTS.length)%ACTS.length;
  actT0=performance.now()/1000;
  actVar=(actVar+1)%5;
  const a=ACTS[actIdx];
  try{a.fn();}catch(e){console.warn(a.id,e);}
}

function showPhoto(){
  photoIdx++;
  const cap=photoCaptions[photoIdx%photoCaptions.length];
  document.getElementById('polaroidCap').textContent=cap;
  if(PHOTOS.length){
    const src=PHOTOS[photoIdx%PHOTOS.length];
    photoBox.innerHTML='<img alt="" src="'+src+'"/>';
  } else {
    const hearts=['♡','♥','✨','🌸','🎂'];
    photoBox.innerHTML='<div class="ph">'+hearts[photoIdx%hearts.length]+'</div>';
  }
}

/* ---------- resize / frame ---------- */
function resize(){
  dpr=Math.min(2, window.devicePixelRatio||1);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  initSnow();initTown();initCandles();
  if(!cats.length) initCats();
  else cats.forEach(c=>{c.homeX=c.lane.x*W;c.homeY=c.lane.y*H;if(c.state==='idle'){c.x=c.homeX;c.y=c.homeY;}});
  if(!paint.strokes.length) startPaintCycle();
  else paint.strokes=buildStrokes(greetings[paint.idx%greetings.length]);
}

function frame(now){
  if(!t0){t0=now;startAct(0);if(!paint.strokes.length)startPaintCycle();}
  const t=now*0.001;
  const dt=Math.min(0.033,(now-(last||now))/1000);last=now;

  // acts
  const act=ACTS[actIdx];
  const elapsed=t-actT0;
  const dur=act.dur*(0.9+(actVar%3)*0.08);
  if(elapsed>dur) startAct(actIdx+1);

  drawSky(t);
  drawTown(t);

  // snow behind table
  snow.forEach(s=>{
    s.x+=s.vx;s.y+=s.vy;
    if(s.y>H){s.y=-5;s.x=Math.random()*W;}
    if(s.x<0)s.x=W;if(s.x>W)s.x=0;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${s.a})`;ctx.fill();
  });

  // foil 24 — right of table, clearly visible
  const bx=W*Z.balloons.x, by=H*Z.balloons.y;
  drawFoilDigit(ctx,'2', bx-70, by, 160, t, 0);
  drawFoilDigit(ctx,'4', bx+75, by+12, 160, t, 1.3);

  drawPainted(t);
  drawTable();

  // candles (on and around table)
  candles.forEach(c=>drawCandle(c,t));

  updateLamplighter(dt,t);
  updatePainter(dt);
  cats.forEach(c=>updateCat(c,dt,t));

  // draw cats sorted by y — front layer
  cats.slice().sort((a,b)=>a.y-b.y).forEach(c=>{
    DrawCat.drawCat(ctx, {
      x:c.x,y:c.y,scale:c.scale,facing:c.facing,phase:c.phase,
      mouth:c.mouth,hat:c.hat,hatColor:c.hatColor,prop:c.prop,
      glasses:c.glasses,t,blink:c.blink,walkPhase:c.walkPhase,
      paintColor:c.paintColor,pose:c.pose
    });
    if(c.bubble) drawBubble(c.x, c.y-c.scale*1.55, c.bubble);
  });

  // soft vignette
  const vg=ctx.createRadialGradient(W*0.5,H*0.45,H*0.2,W*0.5,H*0.5,H*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(10,5,15,.35)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);

  requestAnimationFrame(frame);
}

/* ---------- fullscreen ---------- */
const fsBtn=document.getElementById('fsBtn');
let fsTimer;
function showFs(){document.body.classList.add('cursor-visible');fsBtn.classList.add('visible');clearTimeout(fsTimer);fsTimer=setTimeout(()=>{fsBtn.classList.remove('visible');document.body.classList.remove('cursor-visible');},2500);}
function toggleFs(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen().catch(()=>{});
}
fsBtn.addEventListener('click',toggleFs);
addEventListener('keydown',e=>{if(e.key==='f'||e.key==='F'||e.key==='а'||e.key==='А')toggleFs();});
addEventListener('dblclick',toggleFs);
addEventListener('mousemove',showFs);
document.addEventListener('fullscreenchange',()=>{document.body.classList.toggle('is-fs',!!document.fullscreenElement);});
setTimeout(()=>document.getElementById('hint').classList.add('fade'),6000);

/* ---------- sticky wish cycle in polaroid? keep caption swap mild ---------- */
setInterval(()=>{
  // occasional caption refresh without second frame
  if(Math.random()<0.3) showPhoto();
}, 45000);

addEventListener('resize',resize);
resize();
photoBox.innerHTML='<div class="ph">♡</div>';

// QA jump ?act=
(function(){
  const a=params.get('act');
  if(!a)return;
  const idx=ACTS.findIndex(x=>x.id===a);
  const n=idx>=0?idx:(/^\d+$/.test(a)?(+a)%ACTS.length:-1);
  if(n>=0){t0=performance.now();startAct(n);}
})();

requestAnimationFrame(frame);
})();
</script>
